<title>Mizu.AI · Chat y Personajes</title>
<style>
:root{
  --h:207; --sm:1; --wall:rgba(255,255,255,.3);
  --blue-50:hsl(var(--h) calc(85% * var(--sm)) 97%); --blue-100:hsl(var(--h) calc(80% * var(--sm)) 94%); --blue-200:hsl(var(--h) calc(80% * var(--sm)) 90%); --blue-300:hsl(var(--h) calc(75% * var(--sm)) 85%); --blue-400:hsl(var(--h) calc(65% * var(--sm)) 75%); --blue-600:hsl(var(--h) calc(52% * var(--sm)) 54%); --blue-700:hsl(var(--h) calc(50% * var(--sm)) 40%);
  --yellow-100:#fff8dc; --yellow-200:#fff0b3; --yellow-300:#fbe38a; --yellow-500:#e8c24a;
  --ink:#2a3a4b; --muted:#74879a; --line:hsl(var(--h) calc(60% * var(--sm)) 91%); --white:#fff; --danger:#e07a7a;
  --radius:16px; --shadow:0 6px 24px rgba(74,144,201,.14);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:var(--blue-50);font-size:15px;line-height:1.5}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
.app{display:flex;height:100vh;height:100dvh}

/* Sidebar */
aside{width:292px;background:var(--blue-100);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:14px;gap:10px;flex-shrink:0;transition:transform .25s}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px;padding:4px 6px}
.logo{width:34px;height:34px;border-radius:11px;background:var(--white);border:1.5px solid var(--blue-300);display:grid;place-items:center;font-size:18px;overflow:hidden}
.logo img{width:100%;height:100%;object-fit:contain;display:block}
.tabs{display:grid;grid-template-columns:1fr 1fr;background:var(--white);border-radius:12px;padding:4px;gap:4px}
.tab{padding:8px;border-radius:9px;font-weight:600;color:var(--muted);font-size:14px}
.tab.on{background:var(--yellow-200);color:var(--ink)}
.btn{padding:10px 14px;border-radius:12px;font-weight:600;transition:.15s}
.btn.primary{background:var(--blue-300);color:var(--blue-700)}
.btn.primary:hover{background:var(--blue-400);color:#fff}
.btn.yellow{background:var(--yellow-300);color:#6b5510}
.btn.yellow:hover{background:var(--yellow-500);color:#fff}
.btn.ghost{background:var(--white);border:1px solid var(--line)}
.btn.ghost:hover{background:var(--blue-50)}
.btn.small{padding:6px 10px;font-size:13px;border-radius:9px}
.search{width:100%;padding:9px 12px;border-radius:12px;border:1px solid var(--line);background:var(--white);outline:none}
.search:focus,.field:focus{border-color:var(--blue-400);box-shadow:0 0 0 3px rgba(141,194,236,.3)}
.list-head{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em;padding:4px 6px;display:flex;justify-content:space-between}
.chats{flex:1;overflow:auto;display:flex;flex-direction:column;gap:3px;margin:0 -4px;padding:0 4px}
.chat-item{display:flex;align-items:center;gap:8px;padding:8px 8px;border-radius:12px;cursor:pointer;position:relative}
.chat-item:hover{background:rgba(255,255,255,.6)}
.chat-item.on{background:var(--white);box-shadow:0 1px 4px rgba(74,144,201,.15)}
.num{font-size:11px;font-weight:700;color:var(--blue-600);background:var(--blue-200);min-width:22px;height:22px;border-radius:7px;display:grid;place-items:center}
.chat-item.on .num{background:var(--yellow-200);color:#7a6210}
.ci-title{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px}
.ci-title small{display:block;color:var(--muted);font-size:11px}
.ci-actions{display:none;gap:2px}
.chat-item:hover .ci-actions,.chat-item.on .ci-actions{display:flex}
.icon-btn{width:24px;height:24px;border-radius:7px;display:grid;place-items:center;color:var(--muted);font-size:13px}
.icon-btn:hover{background:var(--blue-100);color:var(--blue-700)}
.icon-btn.del:hover{background:#fde5e5;color:var(--danger)}
.side-foot{display:flex;gap:8px}

/* Main */
main{flex:1;min-width:0;display:flex;flex-direction:column;background:linear-gradient(180deg,var(--white),var(--blue-50))}
.topbar{display:flex;align-items:center;gap:10px;padding:12px 18px;border-bottom:1px solid var(--line);background:rgba(255,255,255,.85);backdrop-filter:blur(8px)}
.menu-btn{display:none;font-size:20px;width:36px;height:36px;border-radius:10px;background:var(--blue-100)}
.title-input{flex:1;min-width:0;font-weight:700;font-size:17px;border:1px solid transparent;border-radius:10px;padding:6px 10px;background:transparent;outline:none}
.title-input:hover{background:var(--blue-50)}
.title-input:focus{background:var(--white);border-color:var(--blue-300)}
.badge{display:inline-flex;align-items:center;gap:6px;background:var(--yellow-100);border:1px solid var(--yellow-200);padding:4px 10px;border-radius:99px;font-size:13px;white-space:nowrap}
.view{display:none;flex:1;min-height:0;flex-direction:column}
.view.on{display:flex}
.messages{flex:1;overflow:auto;padding:22px 0}
.wrap{max-width:820px;margin:0 auto;padding:0 18px}
.empty{text-align:center;color:var(--muted);margin:12vh auto 0;max-width:420px}
.messages[style*="background-image"] .empty{background:rgba(255,255,255,.85);border-radius:20px;padding:18px}
.empty .big{font-size:52px}
.empty h2{color:var(--ink);margin:.4em 0 .2em}
.msg{display:flex;gap:12px;margin-bottom:20px}
.msg.user{flex-direction:row-reverse}
.av{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;flex-shrink:0;font-size:18px;background:var(--blue-200)}
.msg.user .av{background:var(--blue-200)}
.body{max-width:calc(100% - 52px);min-width:0}
.bubble{padding:11px 15px;border-radius:var(--radius);background:var(--white);border:1px solid var(--line);box-shadow:0 1px 3px rgba(74,144,201,.08);word-wrap:break-word;overflow-wrap:anywhere}
.msg.user .bubble{background:var(--blue-200);border-color:var(--blue-300)}
:root[data-tone="deep"]:not([data-mode="dark"]) .msg.user .bubble{border-color:var(--blue-200)}
.msg.err .bubble{background:#fff0f0;border-color:#f3c7c7}
.bubble p{margin:0 0 .6em}.bubble p:last-child{margin:0}
.bubble pre{background:var(--blue-50);border:1px solid var(--line);border-radius:10px;padding:10px;overflow:auto;font-size:13px}
.bubble code{background:var(--blue-100);padding:1px 5px;border-radius:5px;font-size:.9em}
.bubble pre code{background:none;padding:0}
.bubble em{color:var(--blue-700)}
.actions{display:flex;flex-wrap:wrap;gap:2px;margin-top:6px;padding:3px;width:fit-content;max-width:100%;background:var(--white);border:1px solid var(--line);border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.08);opacity:0;transition:.15s}
.msg:hover .actions,.msg:focus-within .actions{opacity:1}
.msg.user .actions{justify-content:flex-end;margin-left:auto}
.act{font-size:12px;color:var(--muted);padding:3px 8px;border-radius:8px}
.act:hover{background:var(--blue-100);color:var(--blue-700)}
.act.del:hover{background:#fde5e5;color:var(--danger)}
.editor{background:var(--white);border:2px solid var(--blue-300);border-radius:var(--radius);padding:10px;width:min(620px,78vw)}
.editor textarea{width:100%;min-height:90px;border:0;outline:none;resize:vertical;background:transparent}
.editor .row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:6px}
.editor select{border:1px solid var(--line);border-radius:8px;padding:4px 6px;background:var(--blue-50)}
.typing span{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--blue-400);margin:0 2px;animation:b 1s infinite}
.typing span:nth-child(2){animation-delay:.15s}.typing span:nth-child(3){animation-delay:.3s}
@keyframes b{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-5px)}}
.composer{padding:10px 18px 18px}
/* Botón Continuar (como DeepSeek) cuando una respuesta se detuvo o se cortó */
.contBar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:10px 4px 2px}
.contLbl{color:var(--muted);font-weight:600;font-size:15px}
.contBtn{border:1px solid var(--line);background:var(--white);color:var(--ink);border-radius:999px;padding:9px 22px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit}
.contBtn:hover{background:var(--blue-100)}
.contBtn:active{transform:scale(.97)}

/* Barra para encoger / bajar el área de escribir (útil en móvil) */
.cbar{display:flex;justify-content:center;margin:-6px 0 6px}
.cbar button{border:1px solid var(--line);background:var(--white);color:var(--muted);border-radius:999px;padding:3px 26px;font-size:15px;line-height:1.2;cursor:pointer;min-height:28px}
.composer[data-cs="1"] .tools,.composer[data-cs="1"] .hint{display:none!important}
.composer[data-cs="2"]>:not(.cbar){display:none!important}
.composer[data-cs="2"]{padding-top:6px;padding-bottom:10px}
.composer[data-cs="2"] .cbar{margin:0}
@media(max-width:560px){
  .composer[data-cs="1"] .box{flex-wrap:nowrap;align-items:flex-end}
  .composer[data-cs="1"] .box textarea{flex:1 1 auto;flex-basis:auto;min-width:0}
  .composer[data-cs="1"] .send{flex:0 0 auto;padding:0 10px;font-size:13px}
}

.box{max-width:820px;margin:0 auto;background:var(--white);border:1.5px solid var(--blue-200);border-radius:20px;padding:10px 12px;box-shadow:var(--shadow);display:flex;gap:10px;align-items:flex-end}
.box:focus-within{border-color:var(--blue-400)}
.box textarea{flex:1;border:0;outline:none;resize:none;max-height:180px;min-height:26px;background:transparent;padding:4px}
.role-sel{border:1px solid var(--line);background:var(--blue-100);border-radius:12px;padding:8px 8px;font-weight:600;font-size:13px;outline:none;cursor:pointer;height:40px;flex-shrink:0}
.role-sel.ai{background:var(--yellow-200);border-color:var(--yellow-300)}
.send{height:40px;padding:0 13px;border-radius:13px;font-size:14px;font-weight:700;flex-shrink:0;white-space:nowrap}
.send.user{background:var(--blue-200);color:var(--blue-700)}
.send.user:hover{background:var(--blue-400);color:#fff}
.send.ai{background:var(--yellow-300);color:#6b5510}
.send.ai:hover{background:var(--yellow-500);color:#fff}
.send.stop{background:var(--blue-300);color:var(--blue-700)}
@media(max-width:560px){.box{flex-wrap:wrap}.box textarea{flex-basis:100%}.send{flex:1}}
.hint{text-align:center;font-size:12px;color:var(--muted);margin-top:8px}

/* Characters */
.chars-wrap{flex:1;overflow:auto;padding:24px 18px}
.chars-in{max-width:1000px;margin:0 auto}
.chars-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.chars-head h1{margin:0;font-size:24px}
.chars-head p{margin:2px 0 0;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.card{background:var(--white);border:1px solid var(--line);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:10px;box-shadow:0 2px 10px rgba(74,144,201,.07);transition:.15s}
.card:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.card-top{display:flex;gap:12px;align-items:center}
.cav{width:56px;height:56px;border-radius:18px;display:grid;place-items:center;font-size:30px;flex-shrink:0}
.card h3{margin:0;font-size:16px}
.card .tag{color:var(--muted);font-size:13px}
.card .desc{font-size:13.5px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;flex:1}
.chips{display:flex;gap:5px;flex-wrap:wrap}
.chip{font-size:11.5px;padding:2px 8px;border-radius:99px;background:var(--blue-100);color:var(--blue-700)}
.card-foot{display:flex;gap:6px}
.card-foot .btn{flex:1}
.new-card{border:2px dashed var(--yellow-300);background:var(--yellow-100);align-items:center;justify-content:center;text-align:center;min-height:190px;cursor:pointer;color:#7a6210;font-weight:600}
.new-card .plus{font-size:40px;line-height:1}

/* Modals */
.modal-bg{position:fixed;inset:0;background:rgba(42,58,75,.35);display:none;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal-bg.on{display:flex}
.modal{background:var(--white);border-radius:22px;width:min(560px,100%);max-height:92vh;overflow:auto;padding:22px;box-shadow:0 20px 60px rgba(42,58,75,.25)}
.modal h2{margin:0 0 14px}
.f{margin-bottom:12px}
.f label{display:block;font-size:13px;font-weight:600;margin-bottom:4px}
.f small{color:var(--muted);font-weight:400}
.field{width:100%;padding:9px 12px;border-radius:12px;border:1px solid var(--line);background:var(--blue-50);outline:none}
textarea.field{resize:vertical;min-height:70px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.emojis,.colors{display:flex;gap:6px;flex-wrap:wrap}
.em{width:38px;height:38px;border-radius:11px;font-size:20px;background:var(--blue-50);border:2px solid transparent}
.em.on{border-color:var(--blue-400);background:var(--blue-100)}
.co{width:30px;height:30px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1.5px var(--line)}
.co.on{box-shadow:0 0 0 2.5px var(--blue-600)}
.modal-foot{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(30px);background:var(--ink);color:#fff;padding:9px 16px;border-radius:12px;opacity:0;transition:.25s;pointer-events:none;z-index:99;font-size:14px}
.toast.on{opacity:1;transform:translateX(-50%)}
.scrim{display:none}

/* Imágenes / avatares */
.av,.cav{overflow:hidden}
.bgimg{display:none}
.av img,.cav img,.img-prev img,.mini img{width:100%;height:100%;object-fit:cover;object-position:50% 0%;display:block}
.img-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.img-prev{width:56px;height:56px;border-radius:18px;display:grid;place-items:center;font-size:30px;overflow:hidden;background:var(--blue-100);flex-shrink:0}
.mini{display:inline-grid;width:20px;height:20px;border-radius:7px;overflow:hidden;place-items:center;vertical-align:middle;font-size:14px}

@media(max-width:800px){
  aside{position:fixed;inset:0 auto 0 0;z-index:40;transform:translateX(-100%);width:84%;max-width:310px;box-shadow:var(--shadow)}
  aside.open{transform:none}
  .scrim.on{display:block;position:fixed;inset:0;background:rgba(42,58,75,.3);z-index:30}
  .menu-btn{display:block}
  .actions{opacity:1}
  .two{grid-template-columns:1fr}
}
/* Mensaje vacío legible sobre el fondo */
.has-bg .empty{max-width:420px;margin:10vh auto 0;padding:22px;background:var(--white);border:1px solid var(--line);border-radius:20px}

/* Temas intensos (colores oscuros) en modo claro */
:root[data-tone="deep"]{
  --blue-50:hsl(var(--h) calc(28% * var(--sm)) 95%); --blue-100:hsl(var(--h) calc(28% * var(--sm)) 91%); --blue-200:hsl(var(--h) calc(30% * var(--sm)) 85%);
  --blue-300:hsl(var(--h) calc(42% * var(--sm)) 36%); --blue-400:hsl(var(--h) calc(44% * var(--sm)) 30%); --blue-600:hsl(var(--h) calc(46% * var(--sm)) 30%); --blue-700:hsl(var(--h) calc(42% * var(--sm)) 22%);
  --line:hsl(var(--h) calc(25% * var(--sm)) 84%);
}
:root[data-tone="deep"]:not([data-mode="dark"]) .btn.primary,:root[data-tone="deep"]:not([data-mode="dark"]) .send.user,:root[data-tone="deep"]:not([data-mode="dark"]) .send.stop{color:#fff}

/* Modo oscuro */
:root[data-mode="dark"]{
  color-scheme:dark; --wall:rgba(0,0,0,.4);
  --blue-50:#151517; --blue-100:#1c1c1f; --blue-200:#28282d; --blue-300:hsl(var(--h) calc(33% * var(--sm)) 29%); --blue-400:hsl(var(--h) calc(38% * var(--sm)) 42%); --blue-600:hsl(var(--h) calc(65% * var(--sm)) 70%); --blue-700:hsl(var(--h) calc(70% * var(--sm)) 82%);
  --yellow-100:#3a3320; --yellow-200:#4d4326; --yellow-300:#6b5a22; --yellow-500:#c9a63a;
  --ink:#ececf0; --muted:#9a9aa3; --line:#37373d; --white:#212125; --danger:#e88a8a;
  --shadow:0 6px 24px rgba(0,0,0,.35);
}
:root[data-mode="dark"] .btn.yellow,:root[data-mode="dark"] .send.ai{color:#fff3c4}
:root[data-mode="dark"] .chat-item.on .num,:root[data-mode="dark"] .new-card{color:#f3dd8a}
:root[data-mode="dark"] .topbar{background:rgba(21,21,23,.88)}
:root[data-mode="dark"] .chat-item:hover{background:rgba(255,255,255,.06)}
:root[data-mode="dark"] .msg.err .bubble{background:#3a2226;border-color:#6b3a3f}
:root[data-mode="dark"] .icon-btn.del:hover,:root[data-mode="dark"] .act.del:hover{background:#3a2226}
:root[data-mode="dark"] .toast{color:#16202c}
:root[data-mode="dark"] .actions{box-shadow:0 2px 8px rgba(0,0,0,.4)}
.tools{max-width:820px;margin:0 auto 6px;display:flex;gap:6px;flex-wrap:wrap}
.tg{border:1.5px solid var(--blue-200);background:var(--white);border-radius:999px;padding:4px 11px;font-size:13px;font-weight:600;color:var(--muted)}
.tg.on{background:var(--yellow-200);border-color:var(--yellow-300);color:var(--ink)}
.chips{max-width:820px;margin:0 auto;display:flex;flex-wrap:wrap}
.fchip{display:inline-flex;align-items:center;gap:6px;background:var(--blue-100);border:1px solid var(--line);border-radius:10px;padding:3px 8px;font-size:12.5px;margin:0 6px 6px 0}
.fchip img{width:22px;height:22px;border-radius:5px;object-fit:cover}
.fchip button{color:var(--muted);font-size:15px;line-height:1}
.att{max-width:220px;max-height:180px;border-radius:10px;display:block;margin-bottom:8px}
.think{margin-bottom:8px;font-size:13px;color:var(--muted)}.think summary{cursor:pointer;font-weight:600}
.think div{white-space:pre-wrap;margin-top:6px;padding-left:10px;border-left:3px solid var(--blue-200)}
.sec{font-weight:700;margin:14px 0 2px;padding-top:10px;border-top:1px solid var(--line)}.sec+small{display:block;color:var(--muted);margin-bottom:6px;font-size:12.5px}
.srcs{margin-top:10px;font-size:12.5px;color:var(--muted)}
.srcs a{color:var(--blue-700);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.msg .bubble{font-size:var(--fs,18px);line-height:1.65}.bubble pre{font-size:.85em}
.fsb{padding:6px 10px;font-weight:700}
.tag{display:block;font-size:11.5px;font-weight:500;color:var(--muted);line-height:1.25;margin-top:1px}
.legal{margin-top:3px}.legal a{color:var(--muted);text-decoration:underline}

/* ---- Selección de turnos / compartir ---- */
.selTop{display:none;align-items:center;gap:12px;padding:12px 16px;background:var(--white);border-bottom:1px solid var(--line);font-weight:600}
.selTop .selAll{display:flex;align-items:center;gap:10px;background:none;font:inherit;color:var(--ink);padding:4px}
.selbox{width:26px;height:26px;border-radius:50%;border:2px solid var(--blue-400);background:var(--white);color:#fff;font-size:15px;line-height:1;display:grid;place-items:center;flex-shrink:0;align-self:center;padding:0}
.selbox.on{background:var(--blue-600);border-color:var(--blue-600)}
.msg.selmode{cursor:pointer;gap:10px;padding:6px 8px;border-radius:14px}
.msg.selmode .actions{display:none!important}
.msg.selmode.picked{background:var(--blue-100)}
.msg.selmode .bubble{pointer-events:none}
#selBar{display:none;flex-direction:column;gap:10px;padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px));background:var(--white);border-top:1px solid var(--line);position:relative}
#selBar .selHead{display:flex;align-items:center;justify-content:center;font-weight:700;position:relative}
#selBar .selX{position:absolute;right:0;top:50%;transform:translateY(-50%);font-size:22px;color:var(--ink);padding:4px 8px}
#selBar .selActs{display:flex;justify-content:space-around;gap:8px}
#selBar .selAct{display:flex;flex-direction:column;align-items:center;gap:6px;background:none;color:var(--ink);font:inherit;font-weight:600;font-size:14px;min-width:84px}
#selBar .selAct .ic{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;font-size:22px;background:var(--blue-200);color:var(--blue-700)}
#selBar .selAct.main .ic{background:var(--blue-600);color:#fff}
#selBar .selAct:disabled{opacity:.45}
#selMenu{display:none;position:absolute;right:16px;bottom:100%;margin-bottom:6px;background:var(--white);border:1px solid var(--line);border-radius:14px;box-shadow:0 6px 20px rgba(0,0,0,.15);padding:6px;min-width:190px;z-index:30}
#selMenu button{display:block;width:100%;text-align:left;padding:10px 12px;border-radius:9px;font:inherit;color:var(--ink);background:none}
#selMenu button:hover{background:var(--blue-100)}
#selMenu .del{color:var(--danger)}
body.selmode .composer,body.selmode #view-chat>.topbar{display:none}
body.selmode .selTop{display:flex}
body.selmode #selBar{display:flex}

/* ---- Orden de la interfaz ---- */
html,body{overflow-x:hidden}
.app,main,.view{min-width:0;max-width:100%}main{overflow:hidden}
.topbar{position:relative;gap:8px}
.badge{max-width:38%;overflow:hidden;text-overflow:ellipsis}
#memBtn,#fsDown,#fsUp,#selBtn,#clearChat{display:none}
#moreMenu{display:none;position:absolute;right:12px;top:calc(100% + 4px);z-index:20;background:var(--white);border:1px solid var(--line);border-radius:14px;box-shadow:0 6px 20px rgba(0,0,0,.15);padding:6px;min-width:200px}
#moreMenu button{display:block;width:100%;text-align:left;padding:10px 12px;border-radius:9px;background:none;color:var(--ink)}
#moreMenu button:hover{background:var(--blue-100)}
.tools{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding-bottom:4px}
.tools::-webkit-scrollbar{display:none}
.tg{flex:none;white-space:nowrap}
.act{padding:3px 6px;white-space:nowrap}
.brand{padding-right:44px}
#sideToggle{position:absolute;top:16px;right:12px;width:32px;height:32px;font-size:22px;background:var(--white);border:1px solid var(--line)}
@media(min-width:801px){aside{position:relative}.app.sideoff aside{display:none}.app.sideoff .menu-btn{display:block}}

/* ---- Menú lateral con zoom grande: se puede deslizar y la lista de chats siempre se ve ---- */
aside{overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
aside>*{flex-shrink:0}
aside>.chats{flex:1 0 220px;min-height:220px;touch-action:pan-y}
.pinTag{float:right;font-size:12px;margin:0 0 2px 8px;opacity:.85}
/* ---- Historial por personaje (estilo Character.AI) ---- */
.ci-av{width:30px;height:30px;border-radius:50%;overflow:hidden;display:grid;place-items:center;flex:none;background:var(--blue-100);font-size:16px}
.ci-av img{width:100%;height:100%;object-fit:cover;object-position:50% 0%}
.tb-ico{flex:none;padding:6px 9px;font-size:15px;line-height:1;white-space:nowrap}
.lbl-s{display:none}
@media(max-width:520px){.lbl-l{display:none}.lbl-s{display:inline}}
.hist-search{padding:10px 12px 0}
.modal.hist{display:flex;flex-direction:column;padding:0;overflow:hidden;width:min(520px,100%);height:min(86vh,760px);max-height:86vh}
.hist-head{display:flex;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line)}
.hist-head .ci-av{width:40px;height:40px;font-size:22px}
.hist-head h2{margin:0;font-size:17px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hist-head small{display:block;color:var(--muted);font-weight:400;font-size:12px}
.hist-list{flex:1;overflow:auto;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.h-item{border:1px solid var(--line);border-radius:14px;padding:10px 12px;cursor:pointer;background:var(--white)}
.h-item:hover{background:var(--blue-50)}
.h-item.on{border-color:var(--blue-400);background:var(--blue-50)}
.h-cur{font-size:12px;font-weight:700;color:var(--blue-600);margin-bottom:2px}
.h-top{display:flex;align-items:center;gap:8px;font-size:13px}
.h-time{font-weight:700;color:var(--ink)}
.h-title{color:var(--muted);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.h-top .sp{flex:1}
.h-act{display:flex;gap:2px;margin-left:auto}
.h-snip{margin-top:6px;font-size:13.5px;line-height:1.45;color:var(--muted);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
.hist-foot{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:space-between}
@media(max-width:800px){.modal.hist{width:100%;height:100vh;height:100dvh;max-height:100dvh;border-radius:0}}

@media(max-width:800px){
#charGrid.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
#charGrid .card{padding:0;gap:0;border-radius:18px;overflow:hidden;cursor:pointer}
#charGrid .card:hover{transform:none}
#charGrid .card-top{flex-direction:column;align-items:stretch;gap:0}
#charGrid .cav{width:100%;height:auto;aspect-ratio:4/5;border-radius:0;font-size:56px;position:relative;overflow:hidden}
#charGrid .cav .bgimg{display:block;position:absolute;left:-12px;top:-12px;width:calc(100% + 24px);height:calc(100% + 24px);object-fit:cover;filter:blur(16px) brightness(.88)}
#charGrid .cav img:not(.bgimg){position:relative;width:100%;height:100%;object-fit:contain}
#charGrid .card-top>div:last-child{padding:10px 12px 0;min-width:0}
#charGrid .card h3{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#charGrid .card .tag{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:12px}
#charGrid .card .desc{font-size:12.5px;-webkit-line-clamp:2;padding:6px 12px 0;flex:none}
#charGrid .chips{display:none}
#charGrid .card-foot{padding:10px 10px 10px;gap:4px}
#charGrid .card-foot [data-a=chat]{display:none}
#charGrid .card-foot .btn{flex:1 1 0!important;padding:6px 0;font-size:14px;min-width:0}
#charGrid .new-card{display:none}
}
.lore-bg{background:rgba(42,58,75,.55)}
.modal.lore{display:flex;flex-direction:column;padding:0;overflow:hidden;width:min(680px,100%);height:min(88vh,820px);max-height:88vh;background:var(--white);box-shadow:0 20px 60px rgba(42,58,75,.35)}
.lore-head{flex:none;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px 12px;border-bottom:1px solid var(--line);background:var(--white)}
.lore-head h2{margin:0;font-size:18px;min-width:0}
.lore-bar{flex:none;display:flex;flex-direction:column;gap:8px;padding:10px 16px 12px;background:var(--white);border-bottom:1px solid var(--line)}
.lore-row{display:flex;gap:10px;align-items:flex-end}
.lore-count{flex:none;font-size:12.5px;font-weight:700;color:var(--blue-700);background:var(--blue-100);padding:9px 11px;border-radius:10px;white-space:nowrap}
.lore-bar .field{font-size:16px}
.lore-body{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:12px 16px 32px;background:var(--white)}
.lore-hint{margin:0 0 12px;color:var(--muted);font-size:13px;line-height:1.45}
.lore-foot{flex:none;display:grid;grid-template-columns:repeat(4,auto);justify-content:end;gap:8px;padding:12px 16px calc(14px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--white)}
.lore-foot .btn{white-space:nowrap;padding:9px 12px;font-size:13.5px}
.le{border:1px solid var(--line);border-radius:14px;margin:0 0 8px;background:var(--white);overflow:hidden}
.le.open{border-color:var(--blue-300);box-shadow:0 2px 10px rgba(74,144,201,.12)}
.le.off .le-title{opacity:.5}
.le-head{display:flex;align-items:center;gap:8px;padding:7px 8px 7px 12px;min-height:50px;cursor:pointer}
.le-title{flex:1;min-width:0;font-size:14px;font-weight:600;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
.le-title.dim{font-weight:400;font-style:italic;color:var(--muted)}
.sw{position:relative;flex:none;width:42px;height:26px;display:inline-block}
.sw input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:pointer;z-index:1}
.sw span{position:absolute;inset:0;border-radius:99px;background:var(--line);border:1px solid var(--blue-300);transition:.15s}
.sw span::after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:.15s}
.sw input:checked+span{background:var(--blue-600);border-color:var(--blue-600)}
.sw input:checked+span::after{transform:translateX(16px)}
.le-ic{flex:none;width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--white);font-size:15px;display:grid;place-items:center;padding:0;color:var(--ink)}
.le-ic.pin{opacity:.45;filter:grayscale(1)}
.le-ic.pin.on{opacity:1;filter:none;background:var(--yellow-100);border-color:var(--yellow-300)}
.le-chev{display:inline-block;font-size:13px;transition:.15s}
.le.open .le-chev{transform:rotate(180deg)}
.le-form{display:flex;flex-direction:column;gap:6px;padding:10px 12px 12px;border-top:1px solid var(--line)}
.le-form label{font-size:12.5px;font-weight:600}
.le-form .field{font-size:16px}
.le-form textarea.field{min-height:200px;line-height:1.5}
.le-note{font-size:12px;color:var(--muted);line-height:1.4}
.le-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:4px}
@media(max-width:600px){
.lore-bg{padding:0;align-items:stretch}
.modal.lore{width:100%;height:100vh;height:100dvh;max-height:100vh;max-height:100dvh;border-radius:0;box-shadow:none}
.lore-foot{grid-template-columns:1fr 1fr;justify-content:stretch}
.lore-foot .btn{padding:11px 8px}
}

/* ---- Lorebook por libros ---- */
[hidden]{display:none!important}
.lore-bg{background:rgba(30,42,56,.96)}
.lore-bk{display:flex;align-items:center;gap:8px;min-width:0}
.lore-bk .btn{flex:none;white-space:nowrap}
.lore-bt{flex:1;min-width:0;font-size:15px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bk{display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:8px 10px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:14px;margin:0 0 10px;background:var(--white)}
.bk.off .bk-cv,.bk.off .bk-main{opacity:.5}
.bk-cv{width:56px;height:56px;border-radius:12px;border:1px solid var(--line);background:var(--blue-100);font-size:26px;display:grid;place-items:center;padding:0;overflow:hidden;cursor:pointer}
.bk-cv img{width:100%;height:100%;object-fit:cover;display:block}
.bk-main{min-width:0}
.bk-name{width:100%;min-width:0;border:1px solid transparent;background:transparent;border-radius:8px;padding:4px 6px;margin-left:-6px;font:inherit;font-size:16px;font-weight:700;color:var(--ink)}
.bk-name:focus{border-color:var(--blue-300);background:var(--white);outline:none}
.bk-meta{font-size:12.5px;color:var(--muted)}
.bk-act{grid-column:1/-1;display:flex;gap:8px;justify-content:flex-end}
.bk-act .btn{white-space:nowrap}
.bk-new{border-style:dashed;border-color:var(--blue-300)}

/* ---- Bloque de pensamiento estilo DeepSeek ---- */
.thk{margin:0 0 10px}
.thk-h{display:inline-flex;align-items:center;gap:6px;font-size:.85em;font-weight:600;color:var(--muted);padding:2px 0;background:none}
.thk-c{display:inline-block;transition:transform .15s;font-size:1.15em;line-height:1}
.thk.open .thk-c{transform:rotate(90deg)}
.thk-b{white-space:pre-wrap;margin:6px 0 4px 4px;padding-left:12px;border-left:3px solid var(--blue-200);color:var(--muted);font-size:.9em;line-height:1.55}
</style>

<script>
(()=>{
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);
const esc=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safeImg=s=>typeof s==='string'&&s.startsWith('data:image/')&&!/["'<>\s]/.test(s)?s:'';
const safeColor=c=>typeof c==='string'&&/^#[0-9a-f]{3,8}$/i.test(c.trim())?c.trim():'#cfe6f9';
const avInner=(img,fb)=>safeImg(img)?`<img src="${img}" alt="">`:esc(fb);
// Lee una imagen, la recorta a cuadrado y la reduce (para que quepa en el almacenamiento del navegador)
function readImg(file,size,keep){return new Promise((res,rej)=>{
  if(!file||!file.type.startsWith('image/'))return rej();
  const r=new FileReader();r.onerror=rej;
  r.onload=()=>{const im=new Image();im.onerror=rej;im.onload=()=>{
    if(keep){ // fondo: conserva proporciones, lado mayor = size
      const k=Math.min(1,size/Math.max(im.width,im.height)),c=document.createElement('canvas');
      c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);
      const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);

function newChat(charId,silent,group){
  const ch={id:uid(),title:t('newChatTitle'),charId:charId||null,messages:[],updated:Date.now()};
  if(group){ch.group=group.ids;ch.title=group.name;ch.charId=null;group.ids.forEach(id=>{const c=getChar(id),m=c&&greetMsg(c);if(m){m.cid=id;ch.messages.push(m)}})}
  else if(charId){const c=getChar(charId)||S.chars.find(x=>x.id===charId);if(c){ch.title=t('chatWith')+c.name;const m=greetMsg(c);if(m)ch.messages.push(m)}}
  S.chats.unshift(ch);S.activeId=ch.id;
  if(!silent){save();renderAll()}
  return ch;
}

/* ---------- Markdown mínimo ---------- */
function md(src){
  let out='',parts=src.split(/```(\w*)\n?([\s\S]*?)```/g);
  for(let i=0;i<parts.length;i+=3){
    out+=inline(parts[i]);
    if(i+2<parts.length)out+=`<pre><code>${esc(parts[i+2])}</code></pre>`;
  }
  return out;
}
function inline(t){
  if(!t.trim())return '';
  return t.split(/\n{2,}/).map(p=>'<p>'+esc(p).replace(/`([^`]+)`/g,'<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>').replace(/\*([^*\n]+)\*/g,'<em>$1</em>').replace(/\n/g,'<br>')+'</p>').join('');
}

function startNew(charId){
  const c=cur();
  const same=c&&!c.group&&((charId&&c.charId===charId)||(!charId&&!c.charId));
  if(same&&c.messages.every(m=>m.role!=='user')){setView('chat');closeMenu();toast(t('alreadyNew'));$('#input').focus();return}
  newChat(charId||null);setView('chat');closeMenu();$('#input').focus();
}
function agoL(ts){const d=Math.round((Date.now()-ts)/864e5);return d>=30?new Date(ts).toLocaleDateString(LANG):ago(ts)}
function syncTb(){const c=cur(),ch=c&&!c.group&&c.charId&&getChar(c.charId);}
function renderSide(){
  const q=$('#search').value.toLowerCase().trim();
  const list=$('#chatList');list.innerHTML='';
  $('#count').textContent=t('chatsCount',{n:S.chats.length});
  // Un solo renglón por personaje (sus chats viven en su historial); los chats generales y grupales van sueltos.
  const seen=new Set(),ents=[];
  S.chats.forEach(c=>{
    const ch=!c.group&&c.charId&&getChar(c.charId);
    if(ch){if(seen.has(ch.id))return;seen.add(ch.id);ents.push({anchor:c,ch,chats:charChats(ch.id)})}
    else ents.push({anchor:c,chats:[c]});
  });
  const hit=c=>c.title.toLowerCase().includes(q)||c.messages.some(m=>m.content.toLowerCase().includes(q));
  const vis=ents.filter(e=>!q||(e.ch&&e.ch.name.toLowerCase().includes(q))||e.chats.some(hit));
  let gn=0;
  vis.forEach((e,k)=>{
    const c=e.anchor,ch=e.ch;
    const last=ch?e.chats[0]:c;
    const active=ch?e.chats.some(x=>x.id===S.activeId):c.id===S.activeId;
    const d=document.createElement('div');d.className='chat-item'+(active?' on':'');
    if(ch){
      d.innerHTML=`<span class="ci-av">${avInner(ch.img,ch.emoji)}</span>
      <span class="ci-title">${esc(ch.name)}<small>${t('chatsCount',{n:e.chats.length})} · ${ago(last.updated)}</small></span>
      <span class="ci-actions">
        <button class="icon-btn" data-a="hist" title="${t('histTip')}">🕘</button>
        <button class="icon-btn" data-a="new" title="${t('newTip')}">＋</button></span>`;
    }else{
      gn++;
      d.innerHTML=`<span class="num">${gn}</span>
      <span class="ci-title">${c.pin?'<span class="mini">📌</span> ':''}${c.group?'<span class="mini">👥</span> ':''}${esc(dispTitle(c))}<small>${t('msgs',{n:c.messages.length})} · ${ago(c.updated)}</small></span>
      <span class="ci-actions">
        <button class="icon-btn" data-a="pin" title="${c.pin?t('unpinBtn'):t('pinBtn')}">${c.pin?'📍':'📌'}</button>
        <button class="icon-btn" data-a="up" title="${t('up')}">↑</button>
        <button class="icon-btn" data-a="down" title="${t('down')}">↓</button>
        <button class="icon-btn" data-a="ren" title="${t('ren')}">✎</button>
        <button class="icon-btn" data-a="dup" title="${t('dup')}">⧉</button>
        <button class="icon-btn del" data-a="del" title="${t('del')}">✕</button></span>`;
    }
    d.onclick=ev=>{
      const a=ev.target.closest('[data-a]')?.dataset.a;
      if(ch){
        if(a==='hist'){openHist(ch.id);return}
        if(a==='new'){startNew(ch.id);return}
        S.activeId=last.id;editing=null;setView('chat');renderAll();closeMenu();return;
      }
      const i=S.chats.indexOf(c);
      if(a==='up'||a==='down'){
        const dir=a==='up'?-1:1;let j=k+dir;
        while(j>=0&&j<vis.length&&vis[j].ch)j+=dir; // salta los renglones de personajes
        if(j>=0&&j<vis.length){const B=S.chats.indexOf(vis[j].anchor);[S.chats[i],S.chats[B]]=[S.chats[B],S.chats[i]];renderAll()}
        return}
      if(a==='pin'){c.pin=!c.pin;if(c.pin&&i>0){S.chats.splice(i,1);S.chats.unshift(c)}renderAll();return}
      if(a==='dup'){const k2=JSON.parse(JSON.stringify(c));k2.id=uid();k2.title=(c.title||t('untitled'))+t('dupSuffix');k2.updated=Date.now();(k2.messages||[]).forEach(m=>{m.id=uid()});S.chats.splice(i+1,0,k2);S.activeId=k2.id;editing=null;setView('chat');renderAll();toast(t('dupDone'));return}
      if(a==='ren'){const n=prompt(t('renPrompt'),dispTitle(c));if(n&&n.trim()){c.title=n.trim();renderAll()}return}
      if(a==='del'){if(confirm(t('delChat'))){S.chats=S.chats.filter(x=>x.id!==c.id);if(!S.chats.length)newChat(null,true);if(!getChat(S.activeId))S.activeId=S.chats[0].id;renderAll()}return}
      S.activeId=c.id;editing=null;setView('chat');renderAll();closeMenu();
    };
    list.appendChild(d);
  });
  syncTb();
}

/* ---------- Historial de un personaje (como Character.AI) ---------- */
let histChar=null;
function openHist(id){histChar=id;$('#histSearch').value='';renderHist();$('#histModal').classList.add('on')}
function renderHist(){
  const ch=getChar(histChar);
  if(!ch){$('#histModal').classList.remove('on');return}
  $('#histAv').innerHTML=avInner(ch.img,ch.emoji);
  $('#histName').textContent=ch.name;
  const l=charChats(ch.id);
  $('#histSub').textContent=t('histBtn')+' · '+t('chatsCount',{n:l.length});
  const box=$('#histList');box.innerHTML='';
  const hq=$('#histSearch').value.toLowerCase().trim();
  const f=hq?l.filter(c=>c.title.toLowerCase().includes(hq)||c.messages.some(m=>m.content&&m.content.toLowerCase().includes(hq))):l;
  if(!f.length){box.innerHTML='<p style="color:var(--muted)">'+esc(t(l.length?'histNone':'histEmpty'))+'</p>';return}
  f.forEach(c=>{
    const lm=[...c.messages].reverse().find(m=>m.content&&m.content.trim());
    const snip=lm?lm.content.replace(/\*/g,'').replace(/\s+/g,' ').trim().slice(0,260):t('noMsgs');
    const on=c.id===S.activeId;
    const d=document.createElement('div');d.className='h-item'+(on?' on':'');
    d.innerHTML=(on?`<div class="h-cur">${esc(t('curChat'))}</div>`:'')+
      `<div class="h-top"><span class="h-time">${agoL(c.updated||Date.now())}</span>${isDefaultTitle(c.title)?'<span class="sp"></span>':`<span class="h-title">${esc(c.title)}</span>`}
      <span class="h-act"><button class="icon-btn" data-a="ren" title="${t('ren')}">✎</button><button class="icon-btn" data-a="dup" title="${t('dup')}">⧉</button><button class="icon-btn del" data-a="del" title="${t('del')}">✕</button></span></div>
      <div class="h-snip">${esc(snip)}</div>`;
    d.onclick=ev=>{
      const a=ev.target.closest('[data-a]')?.dataset.a;
      if(a==='ren'){const n=prompt(t('renPrompt'),dispTitle(c));if(n&&n.trim()){c.title=n.trim();renderAll();renderHist()}return}
      if(a==='dup'){const k2=JSON.parse(JSON.stringify(c));k2.id=uid();k2.title=(c.title||t('untitled'))+t('dupSuffix');k2.updated=Date.now();(k2.messages||[]).forEach(m=>{m.id=uid()});S.chats.splice(S.chats.indexOf(c)+1,0,k2);renderAll();renderHist();toast(t('dupDone'));return}
      if(a==='del'){
        if(!confirm(t('delChat')))return;
        S.chats=S.chats.filter(x=>x.id!==c.id);
        if(!getChat(S.activeId)){const r=charChats(ch.id);if(r.length)S.activeId=r[0].id;else newChat(ch.id,true)}
        renderAll();renderHist();return}
      S.activeId=c.id;editing=null;$('#histModal').classList.remove('on');setView('chat');renderAll();closeMenu();
    };
    box.appendChild(d);
  });
}

const aiAv=()=>safeImg(S.profile.aiImg)||MIZU_LOGO;
function avatarFor(m,chat){
  if(m.role==='user')return avInner(persOf(chat).img,'🙂');
  const ch=m.cid?getChar(m.cid):chat.charId&&getChar(chat.charId);return ch?avInner(ch.img,ch.emoji):avInner(aiAv(),'🤖');
}
function applyBg(){
  const m=$('#messages'),b=safeImg(S.profile.bg);
  m.style.backgroundImage=b?`linear-gradient(var(--wall),var(--wall)),url("${b}")`:'';
  m.classList.toggle('has-bg',!!b);
  m.style.backgroundSize='cover';m.style.backgroundPosition='center';
}
function renderChat(){
  applyBg();grpBar();
  const chat=cur();
  $('#titleInput').value=dispTitle(chat);
  const ch=chat.charId&&getChar(chat.charId);
  const b=$('#charBadge');
  if(chat.group){b.style.display='';b.innerHTML='👥 '+esc(chat.group.map(i=>(getChar(i)||{}).name).filter(Boolean).join(', '))}else if(ch){b.style.display='';b.innerHTML=`<span class="mini">${avInner(ch.img,ch.emoji)}</span> ${esc(ch.name)}`}else b.style.display='none';
  const w=$('#msgWrap');w.innerHTML='';
  if(!chat.messages.length){
    w.innerHTML=`<div class="empty"><div class="big">${(ch||chat.group)?'☁️':`<img src="${aiAv()}" alt="" style="width:76px;height:76px;object-fit:cover;border-radius:22px">`}</div><h2>${t('emptyH')}</h2><p>${t('emptyP')}</p></div>`;
  }
  chat.messages.forEach((m,i)=>w.appendChild(msgEl(m,i,chat)));
  $('#hint').textContent=S.settings.key?t('connected',{m:S.settings.model}):t('demoHint');
  applyBg();const box=$('#messages');box.scrollTop=box.scrollHeight;
}
function msgEl(m,i,chat){
  const el=document.createElement('div');
  el.className='msg '+(m.role==='user'?'user':'ai')+(m.error?' err':'');
  const isLast=i===chat.messages.length-1;
  let inner;
  if(editing===m.id){
    inner=`<div class="editor"><textarea id="editArea">${esc(m.content)}</textarea>
      <div class="row">
        <select id="editRole"><option value="user" ${m.role==='user'?'selected':''}>${t('roleUser')}</option><option value="assistant" ${m.role!=='user'?'selected':''}>${t('roleAI')}</option></select>
        <span style="flex:1"></span>
        <button class="btn ghost small" data-x="cancel">${t('cancel')}</button>
        <button class="btn primary small" data-x="save">${t('save')}</button>
        ${m.role==='user'?`<button class="btn yellow small" data-x="resend">${t('resend')}</button>`:''}
      </div></div>`;

function readAttImg(f){return new Promise((ok,no)=>{const u=URL.createObjectURL(f),im=new Image();
  im.onload=()=>{const s=Math.min(1,1024/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);
    const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);ok(c.toDataURL('image/jpeg',.8))};
  im.onerror=()=>no(new Error('img'));im.src=u})}
async function readDocx(f){ // .docx es un zip: leo word/document.xml sin librerías
  const b=new Uint8Array(await f.arrayBuffer()),v=new DataView(b.buffer);let e=b.length-22;
  while(e>=0&&v.getUint32(e,true)!==0x06054b50)e--;if(e<0)throw new Error('zip');
  const n=v.getUint16(e+10,true);let o=v.getUint32(e+16,true);
  for(let i=0;i<n;i++){
    const m=v.getUint16(o+10,true),cs=v.getUint32(o+20,true),nl=v.getUint16(o+28,true),el=v.getUint16(o+30,true),cl=v.getUint16(o+32,true),lo=v.getUint32(o+42,true);
    const name=new TextDecoder().decode(b.slice(o+46,o+46+nl));
    if(name==='word/document.xml'){
      const ds=lo+30+v.getUint16(lo+26,true)+v.getUint16(lo+28,true);let d=b.slice(ds,ds+cs);
      if(m===8)d=new Uint8Array(await new Response(new Blob([d]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer());
      return new TextDecoder().decode(d).replace(/<\/w:p>/g,'\n').replace(/<w:tab\/>/g,'\t').replace(/<w:br[^>]*\/>/g,'\n').replace(/<[^>]+>/g,'')
        .replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&apos;/g,"'").replace(/&amp;/g,'&').trim();
    }
    o+=46+nl+el+cl;
  }
  throw new Error('docx');
}

async function aiOnce(sys,user){ // una llamada simple a la IA configurada, sin mostrarla en el chat
  const st=S.settings,fmt=st.fmt||'openai',out={content:'',think:''};
  const rq=fmt==='openai'?{url:st.url.replace(/\/$/,'')+'/chat/completions',headers:{'Content-Type':'application/json','Authorization':'Bearer '+st.key},

    :buildNative(fmt,st.url,st.key,st.model,sys,[{role:'user',text:user,imgs:[]}],0.3,0);
  const r=await fetch(rq.url,{method:'POST',headers:rq.headers,body:JSON.stringify(rq.body)});
  if(!r.ok)throw new Error('HTTP '+r.status);
  const rd=r.body.getReader(),dec=new TextDecoder();let buf='';
  for(;;){const {done,value}=await rd.read();if(done)break;buf+=dec.decode(value,{stream:true});const lines=buf.split('\n');buf=lines.pop();
    for(const l of lines){const ln=l.trim();if(!ln.startsWith('data:'))continue;const d=ln.slice(5).trim();if(!d||d==='[DONE]')continue;let j;try{j=JSON.parse(d)}catch(_){continue}feedChunk(fmt,j,out)}}

async function maybeSummarize(chat,force){ // resume lo que ya salió de la ventana de mensajes

function cssColor(v){const e=document.createElement('i');e.style.cssText='position:absolute;visibility:hidden;background:'+v;document.body.appendChild(e);const c=getComputedStyle(e).backgroundColor;e.remove();return c}
function stripMd(x){return x.replace(/```\w*\n?/g,'').replace(/^#{1,6}\s+/gm,'').replace(/\*\*(.+?)\*\*/g,'$1').replace(/__(.+?)__/g,'$1').replace(/`([^`]+)`/g,'$1')}
function wrapLines(ctx,text,maxW){
  const out=[];
  for(const para of text.split('\n')){
    if(!para.trim()){out.push('');continue}
    let line='';
    for(const w of para.split(/(\s+)/)){
      if(!w)continue;
      if(ctx.measureText(line+w).width<=maxW){line+=w;continue}
      if(line.trim()){out.push(line.trimEnd());line=''}
      if(/^\s+$/.test(w))continue;
      if(ctx.measureText(w).width<=maxW){line=w;continue}
      for(const ch of w){if(ctx.measureText(line+ch).width>maxW){out.push(line);line=ch}else line+=ch}
    }
    out.push(line.trimEnd());
  }
  return out;
}
function rrect(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
async function makeImages(){
  const chat=cur(),msgs=selList().filter(m=>selTxt(m));
  if(!msgs.length){toast(t('selNone'));return}
  toast(t('imgBusy'),4000);
  await new Promise(r=>setTimeout(r,30));
  const W=900,PAD=36,FS=30,LH=44,BW=W-PAD*2-90,PAGE=2600;
  const cv=document.createElement('canvas'),c=cv.getContext('2d');
  const font=`${FS}px system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",sans-serif`;c.font=font;
  const colUser=cssColor('var(--blue-200)'),colUserBd=cssColor('var(--blue-300)'),colAi=cssColor('#fff'),colAiBd=cssColor('var(--line)'),colBg=cssColor('var(--blue-50)'),colInk='#2a3a4b',colMuted='#74879a';
  // bloques (cada uno cabe en una página; los mensajes largos se parten por líneas)
  const blocks=[];
  const maxLines=Math.floor((PAGE-PAD*2-60)/LH);
  for(const m of msgs){
    const lines=wrapLines(c,stripMd(selTxt(m)),BW-36);
    for(let i=0;i<lines.length;i+=maxLines)blocks.push({u:m.role==='user',name:i?'':selLabel(m,chat),lines:lines.slice(i,i+maxLines)});
  }
  const bh=b=>(b.name?34:0)+b.lines.length*LH+30;
  const pages=[];let cur_=[],h=PAD;
  for(const b of blocks){const need=bh(b)+22;if(cur_.length&&h+need>PAGE-PAD){pages.push({b:cur_,h});cur_=[];h=PAD}cur_.push(b);h+=need}
  if(cur_.length)pages.push({b:cur_,h});
  const files=[];
  for(let p=0;p<pages.length;p++){
    const pg=pages[p];cv.width=W;cv.height=Math.ceil(pg.h+PAD);
    c.font=font;c.fillStyle=colBg;c.fillRect(0,0,W,cv.height);c.textBaseline='top';
    let y=PAD;
    for(const b of pg.b){
      const bw=Math.min(BW,Math.max(...b.lines.map(l=>c.measureText(l).width),60)+36);
      const bx=b.u?W-PAD-bw:PAD,by=y+(b.name?34:0);
      if(b.name){c.font=`600 ${FS-8}px system-ui,sans-serif`;c.fillStyle=colMuted;c.textAlign=b.u?'right':'left';c.fillText(b.name,b.u?W-PAD-6:PAD+6,y+2);c.textAlign='left'}
      rrect(c,bx,by,bw,b.lines.length*LH+30,22);c.fillStyle=b.u?colUser:colAi;c.fill();c.lineWidth=2;c.strokeStyle=b.u?colUserBd:colAiBd;c.stroke();
      c.font=font;c.fillStyle=colInk;b.lines.forEach((l,i)=>c.fillText(l,bx+18,by+15+i*LH));
      y=by+b.lines.length*LH+30+22;
    }
    const blob=await new Promise(r=>cv.toBlob(r,'image/png'));
    files.push(new File([blob],`mizu-chat-${p+1}.png`,{type:'image/png'}));
  }
  try{
    if(navigator.canShare&&navigator.canShare({files})){await navigator.share({files});return}
  }catch(e){if(e&&e.name==='AbortError')return}
  files.forEach((f,i)=>setTimeout(()=>{const a=document.createElement('a');a.href=URL.createObjectURL(f);a.download=f.name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000)},i*350));

function pngMeta(buf){ // busca el chunk tEXt/iTXt con "ccv3" o "chara"
  const b=new Uint8Array(buf),v=new DataView(buf);
  if(b.length<8||v.getUint32(0)!==0x89504e47)throw new Error('png');
  const f={},L=new TextDecoder('latin1');let o=8;
  while(o+12<=b.length){
    const n=v.getUint32(o),ty=String.fromCharCode(b[o+4],b[o+5],b[o+6],b[o+7]),d=o+8;
    if(ty==='tEXt'||ty==='iTXt'){
      const z=b.indexOf(0,d);
      if(z>d&&z<d+n){const kw=L.decode(b.slice(d,z));
        if(kw==='chara'||kw==='ccv3'){let s=z+1;
          if(ty==='iTXt'){if(b[s]!==0)s=-1;else{s=b.indexOf(0,s+2)+1;s=b.indexOf(0,s)+1}}
          if(s>0)f[kw]=L.decode(b.slice(s,d+n));}}

    o+=12+n;
  }
  return f.ccv3||f.chara||null;
}

  if(!hasTTS){toast(t('voiceNo'));return}
  if(speakId===m.id){stopSpeak();return}
  const c=m.cid?getChar(m.cid):((chat.charId&&getChar(chat.charId))||S.settings.gvoice);
  const txt=speakClean(m.content||'')||(m.content||'').trim();if(!txt)return;
  speakId=m.id;syncSpeak();
  speakText(txt,c,()=>{speakId=null;syncSpeak()});
}
function fillVoices(sel,id){const s=$(id||'#cVoice');if(!s||!hasTTS)return;
  s.innerHTML='<option value="">'+esc(t('voiceAuto'))+'</option>'+speechSynthesis.getVoices().filter(v=>vLang(v)===LANG).map(v=>`<option value="${esc(v.voiceURI)}">${esc(v.name)} (${esc(v.lang)})</option>`).join('');s.value=sel||''}
function voiceUI(c){
  fillVoices(c&&((c.voiceMap&&c.voiceMap[LANG])||c.voiceURI));
  $('#cGender').value=(c&&c.voiceG)||'';$('#cPitch').value=(c&&c.voicePitch)||1;$('#cRate').value=(c&&c.voiceRate)||1;
  $('#cPitchV').textContent=$('#cPitch').value;$('#cRateV').textContent=$('#cRate').value;
}
if(hasTTS)speechSynthesis.onvoiceschanged=()=>fillVoices($('#cVoice').value);

function persOf(chat){const ps=S.profile.personas||[];const p=chat&&chat.persona&&ps.find(x=>x.id===chat.persona);return p||S.profile}
function pList(){const p=S.profile;if(!Array.isArray(p.personas)||!p.personas.length){p.personas=[{id:'p0',name:p.name||'',img:p.img||'',bio:p.bio||''}];p.activePersona='p0'}
  if(!p.personas.some(x=>x.id===p.activePersona))p.activePersona=p.personas[0].id;return p.personas}
function pAct(){return pList().find(x=>x.id===S.profile.activePersona)}
function pCommit(){const p=S.profile,a=pAct();p.name=$('#pName').value.trim().slice(0,40);p.bio=$('#pBio').value.trim().slice(0,500);if(a){a.name=p.name;a.img=p.img||'';a.bio=p.bio}}
function pLoad(){const p=S.profile,a=pAct();p.name=a.name||'';p.img=a.img||'';p.bio=a.bio||'';$('#pName').value=p.name;$('#pBio').value=p.bio;drawProf()}
function pFill(){const s=$('#persSel');s.innerHTML=pList().map(x=>`<option value="${esc(x.id)}">${esc(x.name||t('persUnnamed'))}</option>`).join('');s.value=S.profile.activePersona}
$('#persSel').onchange=e=>{pList();pCommit();S.profile.activePersona=e.target.value;pLoad();pFill();save()};
$('#persNew').onclick=()=>{pList();pCommit();const n={id:uid(),name:'',img:'',bio:''};S.profile.personas.push(n);S.profile.activePersona=n.id;pLoad();pFill();save()};
$('#persDel').onclick=()=>{const ps=pList();if(ps.length<=1){toast(t('persMin'));return}
  if(!confirm(t('persDelConfirm')))return;const id=S.profile.activePersona;S.profile.personas=ps.filter(x=>x.id!==id);
  S.chats.forEach(c=>{if(c.persona===id)delete c.persona});S.profile.activePersona=S.profile.personas[0].id;pLoad();pFill();save();renderAll()};

  $('#optPers').value=c.persona||'';
  $('#optStyle').innerHTML=[['bal','st_bal'],['fast','st_fast'],['novel','st_novel'],['intense','st_intense']].map(x=>`<option value="${x[0]}">${esc(t(x[1]))}</option>`).join('');
  $('#optStyle').value=c.style||'bal';
  $('#optModal').classList.add('on')};
$('#optSave').onclick=()=>{const c=cur(),p=$('#optPers').value,s=$('#optStyle').value;
  if(p)c.persona=p;else delete c.persona;if(s&&s!=='bal')c.style=s;else delete c.style;
  c.updated=Date.now();$('#optModal').classList.remove('on');renderAll();toast(t('setSaved'))};

function exportStory(md){const chat=cur(),ch=chat.charId&&getChar(chat.charId),me=(persOf(chat).name||'').trim()||t('roleUser');
  const nm=m=>m.role==='user'?me:((m.cid&&getChar(m.cid))?getChar(m.cid).name:(ch?ch.name:t('roleAI')));
  const ms=chat.messages.filter(m=>!m.error&&!m.pending&&(m.content||'').trim());
  if(!ms.length){toast(t('expEmpty'));return}
  const title=dispTitle(chat);
  let out=md?'# '+title+'\n\n':title+'\n'+'='.repeat(Math.min(title.length,60))+'\n\n';
  ms.forEach(m=>{out+=(md?'**'+nm(m)+'**':nm(m)+':')+'\n'+(md?'\n':'')+m.content.trim()+'\n\n'});
  const f=(title.replace(/[\\\/:*?"<>|\s]+/g,'_').slice(0,40)||'story');
  dl(out.trim()+'\n',f+(md?'.md':'.txt'),md?'text/markdown':'text/plain')}
$('#expTxt').onclick=()=>exportStory(false);
$('#expMd').onclick=()=>exportStory(true);
