<title>Mizu.AI · Chat y Personajes</title>
<style>
:root{
  --h:207; --sm:1; --wall:rgba(255,255,255,.3);
  --blue-50:hsl(var(--h) calc(85% * var(--sm)) 97%); --blue-100:hsl(var(--h) calc(80% * var(--sm)) 94%); --blue-200:hsl(var(--h) calc(80% * var(--sm)) 90%); --blue-300:hsl(var(--h) calc(75% * var(--sm)) 85%); --blue-400:hsl(var(--h) calc(65% * var(--sm)) 75%); --blue-600:hsl(var(--h) calc(52% * var(--sm)) 54%); --blue-700:hsl(var(--h) calc(50% * var(--sm)) 40%);
  --yellow-100:#fff8dc; --yellow-200:#fff0b3; --yellow-300:#fbe38a; --yellow-500:#e8c24a;
  --ink:#2a3a4b; --muted:#74879a; --line:hsl(var(--h) calc(60% * var(--sm)) 91%); --white:#fff; --danger:#e07a7a;
  --radius:16px; --shadow:0 6px 24px rgba(74,144,201,.14);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:var(--blue-50);font-size:15px;line-height:1.5}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
.app{display:flex;height:100vh;height:100dvh}

/* Sidebar */
aside{width:292px;background:var(--blue-100);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:14px;gap:10px;flex-shrink:0;transition:transform .25s}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px;padding:4px 6px}
.logo{width:34px;height:34px;border-radius:11px;background:var(--white);border:1.5px solid var(--blue-300);display:grid;place-items:center;font-size:18px;overflow:hidden}
.logo img{width:100%;height:100%;object-fit:contain;display:block}
.tabs{display:grid;grid-template-columns:1fr 1fr;background:var(--white);border-radius:12px;padding:4px;gap:4px}
.tab{padding:8px;border-radius:9px;font-weight:600;color:var(--muted);font-size:14px}
.tab.on{background:var(--yellow-200);color:var(--ink)}
.btn{padding:10px 14px;border-radius:12px;font-weight:600;transition:.15s}
.btn.primary{background:var(--blue-300);color:var(--blue-700)}
.btn.primary:hover{background:var(--blue-400);color:#fff}
.btn.yellow{background:var(--yellow-300);color:#6b5510}
.btn.yellow:hover{background:var(--yellow-500);color:#fff}
.btn.ghost{background:var(--white);border:1px solid var(--line)}
.btn.ghost:hover{background:var(--blue-50)}
.btn.small{padding:6px 10px;font-size:13px;border-radius:9px}
.search{width:100%;padding:9px 12px;border-radius:12px;border:1px solid var(--line);background:var(--white);outline:none}
.search:focus,.field:focus{border-color:var(--blue-400);box-shadow:0 0 0 3px rgba(141,194,236,.3)}
.list-head{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em;padding:4px 6px;display:flex;justify-content:space-between}
.chats{flex:1;overflow:auto;display:flex;flex-direction:column;gap:3px;margin:0 -4px;padding:0 4px}
.chat-item{display:flex;align-items:center;gap:8px;padding:8px 8px;border-radius:12px;cursor:pointer;position:relative}
.chat-item:hover{background:rgba(255,255,255,.6)}
.chat-item.on{background:var(--white);box-shadow:0 1px 4px rgba(74,144,201,.15)}
.num{font-size:11px;font-weight:700;color:var(--blue-600);background:var(--blue-200);min-width:22px;height:22px;border-radius:7px;display:grid;place-items:center}
.chat-item.on .num{background:var(--yellow-200);color:#7a6210}
.ci-title{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px}
.ci-title small{display:block;color:var(--muted);font-size:11px}
.ci-actions{display:none;gap:2px}
.chat-item:hover .ci-actions,.chat-item.on .ci-actions{display:flex}
.icon-btn{width:24px;height:24px;border-radius:7px;display:grid;place-items:center;color:var(--muted);font-size:13px}
.icon-btn:hover{background:var(--blue-100);color:var(--blue-700)}
.icon-btn.del:hover{background:#fde5e5;color:var(--danger)}
.side-foot{display:flex;gap:8px}

/* Main */
main{flex:1;min-width:0;display:flex;flex-direction:column;background:linear-gradient(180deg,var(--white),var(--blue-50))}
.topbar{display:flex;align-items:center;gap:10px;padding:12px 18px;border-bottom:1px solid var(--line);background:rgba(255,255,255,.85);backdrop-filter:blur(8px)}
.menu-btn{display:none;font-size:20px;width:36px;height:36px;border-radius:10px;background:var(--blue-100)}
.title-input{flex:1;min-width:0;font-weight:700;font-size:17px;border:1px solid transparent;border-radius:10px;padding:6px 10px;background:transparent;outline:none}
.title-input:hover{background:var(--blue-50)}
.title-input:focus{background:var(--white);border-color:var(--blue-300)}
.badge{display:inline-flex;align-items:center;gap:6px;background:var(--yellow-100);border:1px solid var(--yellow-200);padding:4px 10px;border-radius:99px;font-size:13px;white-space:nowrap}
.view{display:none;flex:1;min-height:0;flex-direction:column}
.view.on{display:flex}
.messages{flex:1;overflow:auto;padding:22px 0}
.wrap{max-width:820px;margin:0 auto;padding:0 18px}
.empty{text-align:center;color:var(--muted);margin:12vh auto 0;max-width:420px}
.messages[style*="background-image"] .empty{background:rgba(255,255,255,.85);border-radius:20px;padding:18px}
.empty .big{font-size:52px}
.empty h2{color:var(--ink);margin:.4em 0 .2em}
.msg{display:flex;gap:12px;margin-bottom:20px}
.msg.user{flex-direction:row-reverse}
.av{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;flex-shrink:0;font-size:18px;background:var(--blue-200)}
.msg.user .av{background:var(--blue-200)}
.body{max-width:calc(100% - 52px);min-width:0}
.bubble{padding:11px 15px;border-radius:var(--radius);background:var(--white);border:1px solid var(--line);box-shadow:0 1px 3px rgba(74,144,201,.08);word-wrap:break-word;overflow-wrap:anywhere}
.msg.user .bubble{background:var(--blue-200);border-color:var(--blue-300)}
:root[data-tone="deep"]:not([data-mode="dark"]) .msg.user .bubble{border-color:var(--blue-200)}
.msg.err .bubble{background:#fff0f0;border-color:#f3c7c7}
.bubble p{margin:0 0 .6em}.bubble p:last-child{margin:0}
.bubble pre{background:var(--blue-50);border:1px solid var(--line);border-radius:10px;padding:10px;overflow:auto;font-size:13px}
.bubble code{background:var(--blue-100);padding:1px 5px;border-radius:5px;font-size:.9em}
.bubble pre code{background:none;padding:0}
.bubble em{color:var(--blue-700)}
.actions{display:flex;flex-wrap:wrap;gap:2px;margin-top:6px;padding:3px;width:fit-content;max-width:100%;background:var(--white);border:1px solid var(--line);border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.08);opacity:0;transition:.15s}
.msg:hover .actions,.msg:focus-within .actions{opacity:1}
.msg.user .actions{justify-content:flex-end;margin-left:auto}
.act{font-size:12px;color:var(--muted);padding:3px 8px;border-radius:8px}
.act:hover{background:var(--blue-100);color:var(--blue-700)}
.act.del:hover{background:#fde5e5;color:var(--danger)}
.editor{background:var(--white);border:2px solid var(--blue-300);border-radius:var(--radius);padding:10px;width:min(620px,78vw)}
.editor textarea{width:100%;min-height:90px;border:0;outline:none;resize:vertical;background:transparent}
.editor .row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:6px}
.editor select{border:1px solid var(--line);border-radius:8px;padding:4px 6px;background:var(--blue-50)}
.typing span{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--blue-400);margin:0 2px;animation:b 1s infinite}
.typing span:nth-child(2){animation-delay:.15s}.typing span:nth-child(3){animation-delay:.3s}
@keyframes b{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-5px)}}
.composer{padding:10px 18px 18px}
.box{max-width:820px;margin:0 auto;background:var(--white);border:1.5px solid var(--blue-200);border-radius:20px;padding:10px 12px;box-shadow:var(--shadow);display:flex;gap:10px;align-items:flex-end}
.box:focus-within{border-color:var(--blue-400)}
.box textarea{flex:1;border:0;outline:none;resize:none;max-height:180px;min-height:26px;background:transparent;padding:4px}
.role-sel{border:1px solid var(--line);background:var(--blue-100);border-radius:12px;padding:8px 8px;font-weight:600;font-size:13px;outline:none;cursor:pointer;height:40px;flex-shrink:0}
.role-sel.ai{background:var(--yellow-200);border-color:var(--yellow-300)}
.send{height:40px;padding:0 13px;border-radius:13px;font-size:14px;font-weight:700;flex-shrink:0;white-space:nowrap}
.send.user{background:var(--blue-200);color:var(--blue-700)}
.send.user:hover{background:var(--blue-400);color:#fff}
.send.ai{background:var(--yellow-300);color:#6b5510}
.send.ai:hover{background:var(--yellow-500);color:#fff}
.send.stop{background:var(--blue-300);color:var(--blue-700)}
@media(max-width:560px){.box{flex-wrap:wrap}.box textarea{flex-basis:100%}.send{flex:1}}
.hint{text-align:center;font-size:12px;color:var(--muted);margin-top:8px}

/* Characters */
.chars-wrap{flex:1;overflow:auto;padding:24px 18px}
.chars-in{max-width:1000px;margin:0 auto}
.chars-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.chars-head h1{margin:0;font-size:24px}
.chars-head p{margin:2px 0 0;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.card{background:var(--white);border:1px solid var(--line);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:10px;box-shadow:0 2px 10px rgba(74,144,201,.07);transition:.15s}
.card:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.card-top{display:flex;gap:12px;align-items:center}
.cav{width:56px;height:56px;border-radius:18px;display:grid;place-items:center;font-size:30px;flex-shrink:0}
.card h3{margin:0;font-size:16px}
.card .tag{color:var(--muted);font-size:13px}
.card .desc{font-size:13.5px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;flex:1}
.chips{display:flex;gap:5px;flex-wrap:wrap}
.chip{font-size:11.5px;padding:2px 8px;border-radius:99px;background:var(--blue-100);color:var(--blue-700)}
.card-foot{display:flex;gap:6px}
.card-foot .btn{flex:1}
.new-card{border:2px dashed var(--yellow-300);background:var(--yellow-100);align-items:center;justify-content:center;text-align:center;min-height:190px;cursor:pointer;color:#7a6210;font-weight:600}
.new-card .plus{font-size:40px;line-height:1}

/* Modals */
.modal-bg{position:fixed;inset:0;background:rgba(42,58,75,.35);display:none;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal-bg.on{display:flex}
.modal{background:var(--white);border-radius:22px;width:min(560px,100%);max-height:92vh;overflow:auto;padding:22px;box-shadow:0 20px 60px rgba(42,58,75,.25)}
.modal h2{margin:0 0 14px}
.f{margin-bottom:12px}
.f label{display:block;font-size:13px;font-weight:600;margin-bottom:4px}
.f small{color:var(--muted);font-weight:400}
.field{width:100%;padding:9px 12px;border-radius:12px;border:1px solid var(--line);background:var(--blue-50);outline:none}
textarea.field{resize:vertical;min-height:70px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.emojis,.colors{display:flex;gap:6px;flex-wrap:wrap}
.em{width:38px;height:38px;border-radius:11px;font-size:20px;background:var(--blue-50);border:2px solid transparent}
.em.on{border-color:var(--blue-400);background:var(--blue-100)}
.co{width:30px;height:30px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1.5px var(--line)}
.co.on{box-shadow:0 0 0 2.5px var(--blue-600)}
.modal-foot{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(30px);background:var(--ink);color:#fff;padding:9px 16px;border-radius:12px;opacity:0;transition:.25s;pointer-events:none;z-index:99;font-size:14px}
.toast.on{opacity:1;transform:translateX(-50%)}
.scrim{display:none}

/* Imágenes / avatares */
.av,.cav{overflow:hidden}
.av img,.cav img,.img-prev img,.mini img{width:100%;height:100%;object-fit:cover;display:block}
.img-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.img-prev{width:56px;height:56px;border-radius:18px;display:grid;place-items:center;font-size:30px;overflow:hidden;background:var(--blue-100);flex-shrink:0}
.mini{display:inline-grid;width:20px;height:20px;border-radius:7px;overflow:hidden;place-items:center;vertical-align:middle;font-size:14px}

@media(max-width:800px){
  aside{position:fixed;inset:0 auto 0 0;z-index:40;transform:translateX(-100%);width:84%;max-width:310px;box-shadow:var(--shadow)}
  aside.open{transform:none}
  .scrim.on{display:block;position:fixed;inset:0;background:rgba(42,58,75,.3);z-index:30}
  .menu-btn{display:block}
  .actions{opacity:1}
  .two{grid-template-columns:1fr}
}
/* Mensaje vacío legible sobre el fondo */
.has-bg .empty{max-width:420px;margin:10vh auto 0;padding:22px;background:var(--white);border:1px solid var(--line);border-radius:20px}

/* Temas intensos (colores oscuros) en modo claro */
:root[data-tone="deep"]{
  --blue-50:hsl(var(--h) calc(28% * var(--sm)) 95%); --blue-100:hsl(var(--h) calc(28% * var(--sm)) 91%); --blue-200:hsl(var(--h) calc(30% * var(--sm)) 85%);
  --blue-300:hsl(var(--h) calc(42% * var(--sm)) 36%); --blue-400:hsl(var(--h) calc(44% * var(--sm)) 30%); --blue-600:hsl(var(--h) calc(46% * var(--sm)) 30%); --blue-700:hsl(var(--h) calc(42% * var(--sm)) 22%);
  --line:hsl(var(--h) calc(25% * var(--sm)) 84%);
}
:root[data-tone="deep"]:not([data-mode="dark"]) .btn.primary,:root[data-tone="deep"]:not([data-mode="dark"]) .send.user,:root[data-tone="deep"]:not([data-mode="dark"]) .send.stop{color:#fff}

/* Modo oscuro */
:root[data-mode="dark"]{
  color-scheme:dark; --wall:rgba(0,0,0,.4);
  --blue-50:#151517; --blue-100:#1c1c1f; --blue-200:#28282d; --blue-300:hsl(var(--h) calc(33% * var(--sm)) 29%); --blue-400:hsl(var(--h) calc(38% * var(--sm)) 42%); --blue-600:hsl(var(--h) calc(65% * var(--sm)) 70%); --blue-700:hsl(var(--h) calc(70% * var(--sm)) 82%);
  --yellow-100:#3a3320; --yellow-200:#4d4326; --yellow-300:#6b5a22; --yellow-500:#c9a63a;
  --ink:#ececf0; --muted:#9a9aa3; --line:#37373d; --white:#212125; --danger:#e88a8a;
  --shadow:0 6px 24px rgba(0,0,0,.35);
}
:root[data-mode="dark"] .btn.yellow,:root[data-mode="dark"] .send.ai{color:#fff3c4}
:root[data-mode="dark"] .chat-item.on .num,:root[data-mode="dark"] .new-card{color:#f3dd8a}
:root[data-mode="dark"] .topbar{background:rgba(21,21,23,.88)}
:root[data-mode="dark"] .chat-item:hover{background:rgba(255,255,255,.06)}
:root[data-mode="dark"] .msg.err .bubble{background:#3a2226;border-color:#6b3a3f}
:root[data-mode="dark"] .icon-btn.del:hover,:root[data-mode="dark"] .act.del:hover{background:#3a2226}
:root[data-mode="dark"] .toast{color:#16202c}
:root[data-mode="dark"] .actions{box-shadow:0 2px 8px rgba(0,0,0,.4)}
.tools{max-width:820px;margin:0 auto 6px;display:flex;gap:6px;flex-wrap:wrap}
.tg{border:1.5px solid var(--blue-200);background:var(--white);border-radius:999px;padding:4px 11px;font-size:13px;font-weight:600;color:var(--muted)}
.tg.on{background:var(--yellow-200);border-color:var(--yellow-300);color:var(--ink)}
.chips{max-width:820px;margin:0 auto;display:flex;flex-wrap:wrap}
.fchip{display:inline-flex;align-items:center;gap:6px;background:var(--blue-100);border:1px solid var(--line);border-radius:10px;padding:3px 8px;font-size:12.5px;margin:0 6px 6px 0}
.fchip img{width:22px;height:22px;border-radius:5px;object-fit:cover}
.fchip button{color:var(--muted);font-size:15px;line-height:1}
.att{max-width:220px;max-height:180px;border-radius:10px;display:block;margin-bottom:8px}
.think{margin-bottom:8px;font-size:13px;color:var(--muted)}.think summary{cursor:pointer;font-weight:600}
.think div{white-space:pre-wrap;margin-top:6px;padding-left:10px;border-left:3px solid var(--blue-200)}
.sec{font-weight:700;margin:14px 0 2px;padding-top:10px;border-top:1px solid var(--line)}.sec+small{display:block;color:var(--muted);margin-bottom:6px;font-size:12.5px}
.srcs{margin-top:10px;font-size:12.5px;color:var(--muted)}
.srcs a{color:var(--blue-700);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.msg .bubble{font-size:var(--fs,18px);line-height:1.65}.bubble pre{font-size:.85em}
.fsb{padding:6px 10px;font-weight:700}
.tag{display:block;font-size:11.5px;font-weight:500;color:var(--muted);line-height:1.25;margin-top:1px}
.legal{margin-top:3px}.legal a{color:var(--muted);text-decoration:underline}

/* ---- Selección de turnos / compartir ---- */
.selTop{display:none;align-items:center;gap:12px;padding:12px 16px;background:var(--white);border-bottom:1px solid var(--line);font-weight:600}
.selTop .selAll{display:flex;align-items:center;gap:10px;background:none;font:inherit;color:var(--ink);padding:4px}
.selbox{width:26px;height:26px;border-radius:50%;border:2px solid var(--blue-400);background:var(--white);color:#fff;font-size:15px;line-height:1;display:grid;place-items:center;flex-shrink:0;align-self:center;padding:0}
.selbox.on{background:var(--blue-600);border-color:var(--blue-600)}
.msg.selmode{cursor:pointer;gap:10px;padding:6px 8px;border-radius:14px}
.msg.selmode .actions{display:none!important}
.msg.selmode.picked{background:var(--blue-100)}
.msg.selmode .bubble{pointer-events:none}
#selBar{display:none;flex-direction:column;gap:10px;padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px));background:var(--white);border-top:1px solid var(--line);position:relative}
#selBar .selHead{display:flex;align-items:center;justify-content:center;font-weight:700;position:relative}
#selBar .selX{position:absolute;right:0;top:50%;transform:translateY(-50%);font-size:22px;color:var(--ink);padding:4px 8px}
#selBar .selActs{display:flex;justify-content:space-around;gap:8px}
#selBar .selAct{display:flex;flex-direction:column;align-items:center;gap:6px;background:none;color:var(--ink);font:inherit;font-weight:600;font-size:14px;min-width:84px}
#selBar .selAct .ic{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;font-size:22px;background:var(--blue-200);color:var(--blue-700)}
#selBar .selAct.main .ic{background:var(--blue-600);color:#fff}
#selBar .selAct:disabled{opacity:.45}
#selMenu{display:none;position:absolute;right:16px;bottom:100%;margin-bottom:6px;background:var(--white);border:1px solid var(--line);border-radius:14px;box-shadow:0 6px 20px rgba(0,0,0,.15);padding:6px;min-width:190px;z-index:30}
#selMenu button{display:block;width:100%;text-align:left;padding:10px 12px;border-radius:9px;font:inherit;color:var(--ink);background:none}
#selMenu button:hover{background:var(--blue-100)}
#selMenu .del{color:var(--danger)}
body.selmode .composer,body.selmode #view-chat>.topbar{display:none}
body.selmode .selTop{display:flex}
body.selmode #selBar{display:flex}
</style>
</head>

// Lee una imagen, la recorta a cuadrado y la reduce (para que quepa en el almacenamiento del navegador)
function readImg(file,size,keep){return new Promise((res,rej)=>{
  if(!file||!file.type.startsWith('image/'))return rej();
  const r=new FileReader();r.onerror=rej;
  r.onload=()=>{const im=new Image();im.onerror=rej;im.onload=()=>{
    if(keep){ // fondo: conserva proporciones, lado mayor = size
      const k=Math.min(1,size/Math.max(im.width,im.height)),c=document.createElement('canvas');
      c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);
      const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);
      return res(c.toDataURL('image/jpeg',.8));
    }
    const side=Math.min(im.width,im.height),c=document.createElement('canvas');c.width=c.height=size;
    const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,size,size);
    x.drawImage(im,(im.width-side)/2,(im.height-side)/2,side,side,0,0,size,size);
    res(c.toDataURL('image/jpeg',.85));
  };im.src=r.result};
  r.readAsDataURL(file);
})}

/* ---------- Markdown mínimo ---------- */
function md(src){
  let out='',parts=src.split(/```(\w*)\n?([\s\S]*?)```/g);
  for(let i=0;i<parts.length;i+=3){
    out+=inline(parts[i]);
    if(i+2<parts.length)out+=`<pre><code>${esc(parts[i+2])}</code></pre>`;
  }
  return out;
}
function inline(t){
  if(!t.trim())return '';
  return t.split(/\n{2,}/).map(p=>'<p>'+esc(p).replace(/`([^`]+)`/g,'<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>').replace(/\*([^*\n]+)\*/g,'<em>$1</em>').replace(/\n/g,'<br>')+'</p>').join('');
}

        <button class="act del" data-x="del">${t('delMsg')}</button></div>`}`;
  }
  el.innerHTML=`<div class="av">${avatarFor(m,chat)}</div><div class="body">${chat.group&&m.role!=='user'&&m.cid?`<div class="tag" style="margin:0 0 2px 4px">${esc((getChar(m.cid)||{}).name||'')}</div>`:''}${inner}</div>`;
  if(selMode){const on=selSet.has(m.id);el.classList.add('selmode');if(on)el.classList.add('picked');

      m.content=v;if(m.alts)m.alts[m.altIdx]=v;m.role=$('#editRole').value;editing=null;chat.updated=Date.now();

/* ---------- Formatos de API: OpenAI / Anthropic / Gemini ---------- */
function dataParts(u){const m=/^data:([^;]+);base64,(.+)$/.exec(u||'');return m?{mt:m[1],d:m[2]}:null}
function mergeTurns(h){ // alterna roles, empieza y termina con usuario (lo piden Anthropic y Gemini)
  const out=[];
  for(const m of h){
    const imgs=m.role==='user'?m.imgs:[],last=out[out.length-1];
    if(last&&last.role===m.role){last.text=(last.text+'\n\n'+m.text).trim();last.imgs=last.imgs.concat(imgs)}
    else out.push({role:m.role,text:m.text,imgs:[...imgs]});
  }
  if(!out.length||out[0].role!=='user')out.unshift({role:'user',text:'.',imgs:[]});
  if(out[out.length-1].role!=='user')out.push({role:'user',text:'(…)',imgs:[]});
  return out;
}
function buildNative(fmt,base,key,model,sys,hist,temp,cap){
  base=base.replace(/\/+$/,'');const turns=mergeTurns(hist);
  if(fmt==='anthropic'){
    base=base.replace(/\/v1$/,'');
    return{url:base+'/v1/messages',
      headers:{'Content-Type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
      body:{model,max_tokens:cap||4096,temperature:Math.min(1,Math.max(0,temp)),stream:true,system:sys,
        messages:turns.map(m=>({role:m.role,content:[...m.imgs.map(u=>{const p=dataParts(u);return p&&{type:'image',source:{type:'base64',media_type:p.mt,data:p.d}}}).filter(Boolean),{type:'text',text:m.text||'.'}]}))}};
  }
  base=base.replace(/\/v1(beta)?(\/openai)?$/,'');
  return{url:base+'/v1beta/models/'+encodeURIComponent(model.replace(/^models\//,''))+':streamGenerateContent?alt=sse',
    headers:{'Content-Type':'application/json','x-goog-api-key':key},
    body:{systemInstruction:{parts:[{text:sys}]},generationConfig:{temperature:temp},
      contents:turns.map(m=>({role:m.role==='user'?'user':'model',parts:[...m.imgs.map(u=>{const p=dataParts(u);return p&&{inlineData:{mimeType:p.mt,data:p.d}}}).filter(Boolean),{text:m.text||'.'}]}))}};
}
function feedChunk(fmt,j,ai){
  if(fmt==='anthropic'){
    if(j.type==='error')throw new Error((j.error&&j.error.message)||'stream error');
    if(j.type==='content_block_delta'&&j.delta){
      if(j.delta.type==='text_delta')ai.content+=j.delta.text||'';
      else if(j.delta.type==='thinking_delta')ai.think+=j.delta.thinking||'';
    }
  }else if(fmt==='gemini'){
    if(j.error)throw new Error(j.error.message||'error');
    if(j.promptFeedback&&j.promptFeedback.blockReason)throw new Error('Blocked: '+j.promptFeedback.blockReason);
    const ps=(j.candidates&&j.candidates[0]&&j.candidates[0].content&&j.candidates[0].content.parts)||[];
    for(const p of ps)if(typeof p.text==='string'){if(p.thought)ai.think+=p.text;else ai.content+=p.text}
  }else{
    const dl=(j.choices&&j.choices[0]&&j.choices[0].delta)||{};
    ai.content+=dl.content||'';ai.think+=dl.reasoning_content||dl.reasoning||'';
  }
}
async function ask(chat,reuse,spk){
  if(busy)return;
  let ai;
  if(reuse){ // regenerar: guarda la respuesta actual y añade una nueva alternativa
    ai=reuse;if(!ai.alts)ai.alts=ai.error?[]:[ai.content];
    ai.alts.push('');ai.altIdx=ai.alts.length-1;ai.content='';ai.error=false;ai.pending=true;
  }else{ai={id:uid(),role:'assistant',content:'',pending:true,...(chat.group?{cid:spk||pickSpeaker(chat)}:{})};chat.messages.push(ai)}
  ai.think='';ai.sources=null;
  const sync=()=>{if(ai.alts)ai.alts[ai.altIdx]=ai.content};
  const revert=()=>{ // si falla, vuelve a la respuesta anterior
    if(ai.alts&&ai.alts.length>1){ai.alts.pop();ai.altIdx=ai.alts.length-1;ai.content=ai.alts[ai.altIdx];return true}
    delete ai.alts;delete ai.altIdx;return false;
  };
  setBusy(true);renderChat();renderSide();
  const upd=()=>{sync();if(cur().id===chat.id){renderChat()}};
  try{
    const st=S.settings;
    if(!st.key){await demo(chat,ai,upd)}
    else{
      abortCtl=new AbortController();
      const hasImg=chat.messages.some(m=>m!==ai&&!m.error&&(m.files||[]).some(f=>f.k==='img'));
      const srcMsgs=chat.group?chat.messages.map(m=>m===ai?m:grpView(m,ai)):chat.messages;
      let history=srcMsgs.filter(m=>m!==ai&&!m.error).map(m=>{
        const fs=m.files||[];if(!fs.length)return{role:m.role,content:m.content};
        const body=(m.content?m.content+'\n\n':'')+fs.filter(f=>f.k==='txt').map(f=>`[${t('fileLbl')}: ${f.name}]\n${f.text}`).join('\n\n');
        const imgs=fs.filter(f=>f.k==='img');
        return imgs.length?{role:m.role,content:[{type:'text',text:body||'.'},...imgs.map(f=>({type:'image_url',image_url:{url:f.data}}))]}:{role:m.role,content:body};
      });
      let hist=srcMsgs.filter(m=>m!==ai&&!m.error).map(m=>{
        const fs=m.files||[];
        const text=((m.content?m.content+'\n\n':'')+fs.filter(f=>f.k==='txt').map(f=>`[${t('fileLbl')}: ${f.name}]\n${f.text}`).join('\n\n')).trim();
        return{role:m.role==='user'?'user':'assistant',text,imgs:fs.filter(f=>f.k==='img').map(f=>f.data)};
      });
      const ctxN=+((chat.charId||chat.group)?(st.ctxChar??'30'):(st.ctxMax??'20'));
      const cut=a=>{if(!ctxN||a.length<=ctxN)return a;let r=a.slice(-ctxN);while(r.length>1&&r[0].role!=='user')r=r.slice(1);return r};
      history=cut(history);hist=cut(hist);
      let model=st.model,apiUrl=st.url,apiKey=st.key,fmt=st.fmt||'openai';
      if(hasImg&&st.vision)model=st.vision;
      else if(useThink){if(st.turl)fmt='openai';apiUrl=st.turl||st.url;apiKey=st.tkey||st.key;model=st.think||(/deepseek/i.test(apiUrl)?'deepseek-flash':st.model)}
      let sys=systemPrompt(chat,ai.cid)+loreFor(chat)+memFor(chat);
      const capN=+((chat.charId||chat.group)?(st.maxChar??'500'):(st.maxGen??'0')),cap=useThink?0:(capN||0);
      if(cap)sys+='\n\nLength rule: keep every reply under about '+Math.round(cap*0.55)+' words and always finish your last sentence.';
      if(useSearch){
        const q=([...chat.messages].reverse().find(m=>m.role==='user')||{content:''}).content.trim();
        if(!st.surl||!st.skey)toast(t('srcNoKey'));
        else if(q){
          try{
            const hd=(st.shead||'Authorization: Bearer {key}').split(':');
            const sr=await fetch(st.surl,{method:'POST',headers:{'Content-Type':'application/json',[hd[0].trim()]:hd.slice(1).join(':').trim().replace('{key}',st.skey)},
              body:(st.sbody||'{"query":"{q}","max_results":5}').replace('{q}',()=>JSON.stringify(q.slice(0,380)).slice(1,-1))});
            if(!sr.ok)throw new Error('HTTP '+sr.status);
            const rs=findResults(await sr.json());
            if(rs.length){ai.sources=rs.map(x=>({title:x.title,url:x.url}));
              sys+=t('srcIntro',{d:new Date().toLocaleDateString()})+rs.map((x,i)=>`[${i+1}] ${x.title}\n${x.url}\n${x.content.slice(0,700)}`).join('\n\n')}
          }catch(e){toast(t('srcFail')+' ['+((e&&e.message)||'error')+']',7000)}
        }
      }
      let rq;
      if(fmt==='openai')rq={url:apiUrl.replace(/\/$/,'')+'/chat/completions',headers:{'Content-Type':'application/json','Authorization':'Bearer '+apiKey},
        body:{model,temperature:+st.temp,stream:true,...(cap?{max_tokens:cap}:{}),messages:[{role:'system',content:sys},...history]}};
      else rq=buildNative(fmt,apiUrl,apiKey,model,sys,hist,+st.temp,cap);
      const r=await fetch(rq.url,{method:'POST',signal:abortCtl.signal,headers:rq.headers,body:JSON.stringify(rq.body)});
      if(!r.ok)throw new Error('Error '+r.status+': '+(await r.text()).slice(0,300));
      const rd=r.body.getReader(),dec=new TextDecoder();let buf='';
      for(;;){
        const {done,value}=await rd.read();if(done)break;
        buf+=dec.decode(value,{stream:true});
        const lines=buf.split('\n');buf=lines.pop();
        for(const l of lines){
          const ln=l.trim();if(!ln.startsWith('data:'))continue;
          const d=ln.slice(5).trim();if(!d||d==='[DONE]')continue;
          let j;try{j=JSON.parse(d)}catch(_){continue}
          feedChunk(fmt,j,ai);upd();
        }
      }
      if(chat.group&&ai.cid){const nm=(getChar(ai.cid)||{}).name;if(nm)ai.content=ai.content.replace(new RegExp('^\\s*\\**'+nm.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\**\\s*:\\s*','i'),'')}
      if(!ai.content)ai.content=t('emptyResp');
    }
  }catch(e){
    if(e.name!=='AbortError'){
      if(revert())toast('⚠️ '+e.message.slice(0,120));else{ai.content='⚠️ '+e.message;ai.error=true}
    }
    else if(!ai.content){if(!revert())chat.messages=chat.messages.filter(m=>m!==ai)}
  }
  sync();delete ai.pending;abortCtl=null;setBusy(false);chat.updated=Date.now();
  if(chat.messages.length<=3&&isDefaultTitle(chat.title)&&!chat.charId&&!chat.group){
    const f=chat.messages.find(m=>m.role==='user');if(f)chat.title=f.content.slice(0,36);
  }
  renderAll();
  if(S.settings.autoRead&&!ai.error&&ai.content&&cur().id===chat.id)speak(ai,chat);
  maybeSummarize(chat);
}

let pend=[],useThink=false,useSearch=false;
const TXT_EXT=/\.(txt|md|csv|json|html|xml|js|py|log)$/i;
function readAttImg(f){return new Promise((ok,no)=>{const u=URL.createObjectURL(f),im=new Image();
  im.onload=()=>{const s=Math.min(1,1024/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);

async function readDocx(f){ // .docx es un zip: leo word/document.xml sin librerías
  const b=new Uint8Array(await f.arrayBuffer()),v=new DataView(b.buffer);let e=b.length-22;
  while(e>=0&&v.getUint32(e,true)!==0x06054b50)e--;if(e<0)throw new Error('zip');
  const n=v.getUint16(e+10,true);let o=v.getUint32(e+16,true);
  for(let i=0;i<n;i++){
    const m=v.getUint16(o+10,true),cs=v.getUint32(o+20,true),nl=v.getUint16(o+28,true),el=v.getUint16(o+30,true),cl=v.getUint16(o+32,true),lo=v.getUint32(o+42,true);
    const name=new TextDecoder().decode(b.slice(o+46,o+46+nl));
    if(name==='word/document.xml'){
      const ds=lo+30+v.getUint16(lo+26,true)+v.getUint16(lo+28,true);let d=b.slice(ds,ds+cs);
      if(m===8)d=new Uint8Array(await new Response(new Blob([d]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer());

    }

async function aiOnce(sys,user){ // una llamada simple a la IA configurada, sin mostrarla en el chat
  const st=S.settings,fmt=st.fmt||'openai',out={content:'',think:''};
  const rq=fmt==='openai'?{url:st.url.replace(/\/$/,'')+'/chat/completions',headers:{'Content-Type':'application/json','Authorization':'Bearer '+st.key},
      body:{model:st.model,temperature:0.3,stream:true,messages:[{role:'system',content:sys},{role:'user',content:user}]}}
    :buildNative(fmt,st.url,st.key,st.model,sys,[{role:'user',text:user,imgs:[]}],0.3,0);
  const r=await fetch(rq.url,{method:'POST',headers:rq.headers,body:JSON.stringify(rq.body)});
  if(!r.ok)throw new Error('HTTP '+r.status);
  const rd=r.body.getReader(),dec=new TextDecoder();let buf='';
  for(;;){const {done,value}=await rd.read();if(done)break;buf+=dec.decode(value,{stream:true});const lines=buf.split('\n');buf=lines.pop();
    for(const l of lines){const ln=l.trim();if(!ln.startsWith('data:'))continue;const d=ln.slice(5).trim();if(!d||d==='[DONE]')continue;let j;try{j=JSON.parse(d)}catch(_){continue}feedChunk(fmt,j,out)}}
  return out.content.trim();
}
async function maybeSummarize(chat,force){ // resume lo que ya salió de la ventana de mensajes
  const st=S.settings;if(memBusy||!st.key)return 'skip';
  if(!force&&(st.memOn??'1')!=='1')return 'skip';
  const ctxN=+((chat.charId||chat.group)?(st.ctxChar??'30'):(st.ctxMax??'20'));if(!ctxN)return 'skip';
  const msgs=chat.messages.filter(m=>!m.error&&!m.pending&&(m.content||'').trim());
  const old=msgs.slice(0,Math.max(0,msgs.length-ctxN));
  let from=0;
  if(chat.memId){const i=old.findIndex(m=>m.id===chat.memId);if(i>=0)from=i+1;else chat.mem=''}
  const fresh=old.slice(from);
  if(fresh.length<(force?1:10))return 'none';
  memBusy=true;
  try{
    const ch=chat.charId&&getChar(chat.charId),me=(S.profile&&S.profile.name)||'User',ai=ch?ch.name:'AI';
    const txt=await aiOnce('You maintain the long-term memory of an ongoing roleplay or chat. Update the running summary with the new messages. Keep names, relationships, places, key events, promises, decisions and the current situation. Write in the same language as the conversation, in third person, at most about 250 words. Output ONLY the updated summary.',
      '[Current summary]\n'+(chat.mem||'(none)')+'\n\n[New messages]\n'+fresh.map(m=>(m.role==='user'?me:((m.cid&&getChar(m.cid))?getChar(m.cid).name:ai))+': '+m.content.slice(0,1500)).join('\n'));
    if(!txt)return 'fail';
    chat.mem=txt;chat.memId=fresh[fresh.length-1].id;save();return 'ok';
  }catch(e){return 'fail'}finally{memBusy=false}
}

function loreFor(chat){ // entradas activas: palabras clave en los últimos 8 mensajes, o "siempre activa"
  const ms=chat.group?chat.group.map(getChar).filter(Boolean):[chat.charId&&getChar(chat.charId)].filter(Boolean);
  const all=[...(S.lore||[]),...ms.flatMap(c=>c.lore||[])].filter(e=>!e.off&&(e.content||'').trim());
  if(!all.length)return '';
  const scan=chat.messages.filter(m=>!m.error&&!m.pending).slice(-8).map(m=>m.content||'').join('\n').toLowerCase();
  const out=[];let n=0;
  for(const e of all){
    const ks=(e.keys||'').split(',').map(x=>x.trim().toLowerCase()).filter(Boolean);
    if(!(e.always||ks.some(k=>scan.includes(k))))continue;
    const c=mac(e.content.trim(),ms[0]);if(n+c.length>4000)break;n+=c.length;out.push('- '+c);
  }
  return out.length?'\n\n[World info / Lorebook — use when relevant]\n'+out.join('\n'):'';
}

function stripMd(x){return x.replace(/```\w*\n?/g,'').replace(/^#{1,6}\s+/gm,'').replace(/\*\*(.+?)\*\*/g,'$1').replace(/__(.+?)__/g,'$1').replace(/`([^`]+)`/g,'$1')}
function wrapLines(ctx,text,maxW){
  const out=[];
  for(const para of text.split('\n')){
    if(!para.trim()){out.push('');continue}
    let line='';
    for(const w of para.split(/(\s+)/)){
      if(!w)continue;
      if(ctx.measureText(line+w).width<=maxW){line+=w;continue}
      if(line.trim()){out.push(line.trimEnd());line=''}
      if(/^\s+$/.test(w))continue;
      if(ctx.measureText(w).width<=maxW){line=w;continue}
      for(const ch of w){if(ctx.measureText(line+ch).width>maxW){out.push(line);line=ch}else line+=ch}
    }
    out.push(line.trimEnd());
  }
  return out;
}
function rrect(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
async function makeImages(){
  const chat=cur(),msgs=selList().filter(m=>selTxt(m));
  if(!msgs.length){toast(t('selNone'));return}
  toast(t('imgBusy'),4000);
  await new Promise(r=>setTimeout(r,30));
  const W=900,PAD=36,FS=30,LH=44,BW=W-PAD*2-90,PAGE=2600;
  const cv=document.createElement('canvas'),c=cv.getContext('2d');
  const font=`${FS}px system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",sans-serif`;c.font=font;
  const colUser=cssColor('var(--blue-200)'),colUserBd=cssColor('var(--blue-300)'),colAi=cssColor('#fff'),colAiBd=cssColor('var(--line)'),colBg=cssColor('var(--blue-50)'),colInk='#2a3a4b',colMuted='#74879a';
  // bloques (cada uno cabe en una página; los mensajes largos se parten por líneas)
  const blocks=[];
  const maxLines=Math.floor((PAGE-PAD*2-60)/LH);
  for(const m of msgs){
    const lines=wrapLines(c,stripMd(selTxt(m)),BW-36);
    for(let i=0;i<lines.length;i+=maxLines)blocks.push({u:m.role==='user',name:i?'':selLabel(m,chat),lines:lines.slice(i,i+maxLines)});
  }
  const bh=b=>(b.name?34:0)+b.lines.length*LH+30;
  const pages=[];let cur_=[],h=PAD;
  for(const b of blocks){const need=bh(b)+22;if(cur_.length&&h+need>PAGE-PAD){pages.push({b:cur_,h});cur_=[];h=PAD}cur_.push(b);h+=need}
  if(cur_.length)pages.push({b:cur_,h});
  const files=[];
  for(let p=0;p<pages.length;p++){
    const pg=pages[p];cv.width=W;cv.height=Math.ceil(pg.h+PAD);
    c.font=font;c.fillStyle=colBg;c.fillRect(0,0,W,cv.height);c.textBaseline='top';
    let y=PAD;
    for(const b of pg.b){
      const bw=Math.min(BW,Math.max(...b.lines.map(l=>c.measureText(l).width),60)+36);
      const bx=b.u?W-PAD-bw:PAD,by=y+(b.name?34:0);
      if(b.name){c.font=`600 ${FS-8}px system-ui,sans-serif`;c.fillStyle=colMuted;c.textAlign=b.u?'right':'left';c.fillText(b.name,b.u?W-PAD-6:PAD+6,y+2);c.textAlign='left'}
      rrect(c,bx,by,bw,b.lines.length*LH+30,22);c.fillStyle=b.u?colUser:colAi;c.fill();c.lineWidth=2;c.strokeStyle=b.u?colUserBd:colAiBd;c.stroke();
      c.font=font;c.fillStyle=colInk;b.lines.forEach((l,i)=>c.fillText(l,bx+18,by+15+i*LH));
      y=by+b.lines.length*LH+30+22;
    }
    const blob=await new Promise(r=>cv.toBlob(r,'image/png'));
    files.push(new File([blob],`mizu-chat-${p+1}.png`,{type:'image/png'}));
  }
  try{
    if(navigator.canShare&&navigator.canShare({files})){await navigator.share({files});return}
  }catch(e){if(e&&e.name==='AbortError')return}
  files.forEach((f,i)=>setTimeout(()=>{const a=document.createElement('a');a.href=URL.createObjectURL(f);a.download=f.name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000)},i*350));
}

const b64u=u=>{let s='';for(let i=0;i<u.length;i+=0x8000)s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')};
const unb64u=x=>{x=x.replace(/-/g,'+').replace(/_/g,'/');while(x.length%4)x+='=';const b=atob(x),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u};
async function zEnc(o){
  const raw=new TextEncoder().encode(JSON.stringify(o));
  if(typeof CompressionStream==='undefined')return'j='+b64u(raw);
  const cs=new CompressionStream('deflate-raw'),w=cs.writable.getWriter();w.write(raw);w.close();
  return'z='+b64u(new Uint8Array(await new Response(cs.readable).arrayBuffer()));
}
async function zDec(kind,s){
  const u=unb64u(s);
  if(kind==='j')return JSON.parse(new TextDecoder().decode(u));
  const ds=new DecompressionStream('deflate-raw'),w=ds.writable.getWriter();w.write(u);w.close();
  return JSON.parse(new TextDecoder().decode(await new Response(ds.readable).arrayBuffer()));
}

/* ---------- Macros de SillyTavern ---------- */
const mac=(s,ch)=>String(s||'').replace(/\{\{char\}\}|<BOT>/gi,ch?ch.name:'').replace(/\{\{user\}\}|<USER>/gi,((S.profile&&S.profile.name)||'').trim()||'User');
function greetMsg(c){
  const a=[c.greet,...(c.altGreets||[])].filter(Boolean).map(x=>mac(x,c));if(!a.length)return null;
  const m={id:uid(),role:'assistant',content:a[0]};if(a.length>1){m.alts=a;m.altIdx=0}return m;
}
const splitK=s=>String(s||'').split(',').map(x=>x.trim()).filter(Boolean);
const fname=c=>(c.name||'character').replace(/[\\\/:*?"<>|\s]+/g,'_').slice(0,40)||'character';
function dl(data,name,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type}));a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000)}

/* ---------- Lorebook: entrada / salida ---------- */
function loreIn(o){ // acepta V2 (character_book), SillyTavern World Info y arrays simples
  let es=o&&o.entries;if(!es)return [];if(!Array.isArray(es))es=Object.values(es);
  return es.map(e=>{const k=e.keys||e.key||[];
    return{id:uid(),keys:(Array.isArray(k)?k:String(k).split(',')).map(x=>String(x).trim()).filter(Boolean).join(', '),content:String(e.content||''),always:!!(e.constant||e.always),off:e.enabled===false||e.disable===true||e.off===true};
  }).filter(e=>e.content.trim());
}
function loreOut(arr,name){ // formato World Info de SillyTavern
  return{name,entries:Object.fromEntries(arr.map((e,i)=>[i,{uid:i,key:splitK(e.keys),keysecondary:[],comment:splitK(e.keys)[0]||'',content:e.content||'',constant:!!e.always,selective:false,disable:!!e.off,order:100,position:0}]))};
}

/* ---------- Tarjetas de personaje: leer ---------- */
function pngMeta(buf){ // busca el chunk tEXt/iTXt con "ccv3" o "chara"
  const b=new Uint8Array(buf),v=new DataView(buf);
  if(b.length<8||v.getUint32(0)!==0x89504e47)throw new Error('png');
  const f={},L=new TextDecoder('latin1');let o=8;
  while(o+12<=b.length){
    const n=v.getUint32(o),ty=String.fromCharCode(b[o+4],b[o+5],b[o+6],b[o+7]),d=o+8;
    if(ty==='tEXt'||ty==='iTXt'){
      const z=b.indexOf(0,d);
      if(z>d&&z<d+n){const kw=L.decode(b.slice(d,z));
        if(kw==='chara'||kw==='ccv3'){let s=z+1;
          if(ty==='iTXt'){if(b[s]!==0)s=-1;else{s=b.indexOf(0,s+2)+1;s=b.indexOf(0,s)+1}}
          if(s>0)f[kw]=L.decode(b.slice(s,d+n));}}
    }
    if(ty==='IEND')break;
    o+=12+n;
  }
  return f.ccv3||f.chara||null;
}
const b64utf8=s=>new TextDecoder('utf-8').decode(Uint8Array.from(atob(s.replace(/\s/g,'')),c=>c.charCodeAt(0)));
function cardToChar(raw){ // V1 / V2 / V3 -> personaje de Mizu
  const d=(raw&&raw.data&&typeof raw.data==='object')?raw.data:raw;
  if(!d||typeof d!=='object'||!d.name)throw new Error('card');
  const s=x=>typeof x==='string'?x:'',arr=x=>Array.isArray(x)?x:[];
  let desc=s(d.description).trim();const pe=s(d.personality).trim();if(pe)desc+=(desc?'\n\n':'')+'Personality: '+pe;
  const c={name:s(d.name).slice(0,40),tagline:s(d.creator_notes).split('\n')[0].replace(/<[^>]*>/g,'').trim().slice(0,70),emoji:EMOJIS[0],color:COLORS[Math.floor(Math.random()*COLORS.length)],img:'',
    desc:desc||s(d.name),greet:s(d.first_mes),scene:s(d.scenario),example:s(d.mes_example),tags:arr(d.tags).map(String).slice(0,12),
    altGreets:arr(d.alternate_greetings).map(s).filter(Boolean),sysp:s(d.system_prompt),phi:s(d.post_history_instructions)};
  if(d.character_book)c.lore=loreIn(d.character_book);
  return c;
}
async function importCards(files){
  let ok=0;
  for(const f of files){
    try{
      let raw,img='';
      if(/\.json$/i.test(f.name)||f.type==='application/json')raw=JSON.parse(await f.text());
      else{const m=pngMeta(await f.arrayBuffer());if(!m)throw new Error('card');raw=JSON.parse(b64utf8(m));img=await readImg(f,320).catch(()=>'')}
      if(raw&&raw.chats)throw new Error('backup');
      if(raw&&raw.entries&&!raw.name&&!raw.data){toast(t('cardLore'),4000);continue}
      const c=cardToChar(raw);if(img)c.img=img;
      S.chars.unshift({id:uid(),...c});ok++;
    }catch(err){toast(t('cardBad',{f:f.name}),4000)}
  }
  if(ok){renderAll();toast(t('cardOk',{n:ok}))}
}
$('#impCard').onclick=()=>$('#cardIn').click();
$('#cardIn').onchange=e=>{const fs=[...e.target.files];e.target.value='';importCards(fs)};
const vc=$('#view-chars');vc.addEventListener('dragover',e=>e.preventDefault());
vc.addEventListener('drop',e=>{e.preventDefault();if(e.dataTransfer&&e.dataTransfer.files.length)importCards([...e.dataTransfer.files])});

/* ---------- Tarjetas de personaje: exportar (V2) ---------- */
function cardOf(c){
  const lore=c.lore||[];
  return{spec:'chara_card_v2',spec_version:'2.0',data:{name:c.name,description:c.desc||'',personality:'',scenario:c.scene||'',first_mes:c.greet||'',mes_example:c.example||'',creator_notes:c.tagline||'',
    system_prompt:c.sysp||'',post_history_instructions:c.phi||'',alternate_greetings:c.altGreets||[],tags:c.tags||[],creator:'',character_version:'1',extensions:{},
    ...(lore.length?{character_book:{name:c.name+' Lorebook',extensions:{},entries:lore.map((e,i)=>({id:i,keys:splitK(e.keys),secondary_keys:[],comment:'',content:e.content||'',enabled:!e.off,insertion_order:i,case_sensitive:false,constant:!!e.always,selective:false,position:'before_char',extensions:{}}))}}:{})}};
}
const CRC=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xedb88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
const crc32=u=>{let c=0xffffffff;for(let i=0;i<u.length;i++)c=CRC[(c^u[i])&255]^(c>>>8);return(c^0xffffffff)>>>0};
async function exportPNG(c){
  const cv=document.createElement('canvas'),x=cv.getContext('2d');cv.width=cv.height=512;
  x.fillStyle=safeColor(c.color);x.fillRect(0,0,512,512);
  if(safeImg(c.img)){const im=await new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=no;i.src=c.img});x.drawImage(im,0,0,512,512)}
  else{x.font='300px system-ui,sans-serif';x.textAlign='center';x.textBaseline='middle';x.fillText(c.emoji||'🙂',256,280)}
  const png=new Uint8Array(await(await new Promise(r=>cv.toBlob(r,'image/png'))).arrayBuffer());
  const u8=new TextEncoder().encode(JSON.stringify(cardOf(c)));let bin='';for(let i=0;i<u8.length;i+=0x8000)bin+=String.fromCharCode.apply(null,u8.subarray(i,i+0x8000));
  const data=new TextEncoder().encode('chara\0'+btoa(bin)),ch=new Uint8Array(12+data.length),dv=new DataView(ch.buffer);
  dv.setUint32(0,data.length);ch.set([116,69,88,116],4);ch.set(data,8);dv.setUint32(8+data.length,crc32(ch.subarray(4,8+data.length)));
  const at=png.length-12,out=new Uint8Array(png.length+ch.length); // el último chunk (IEND) mide 12 bytes
  out.set(png.subarray(0,at));out.set(ch,at);out.set(png.subarray(at),at+ch.length);
  dl(out,fname(c)+'.png','image/png');
}

/* ---------- Chats grupales ---------- */
let grpStop=false;
function pickSpeaker(chat){
  const ids=chat.group.filter(getChar);if(!ids.length)return null;
  const msgs=chat.messages.filter(m=>!m.error&&!m.pending),last=msgs[msgs.length-1]||{},txt=(last.content||'').toLowerCase();
  const named=ids.filter(id=>id!==last.cid&&txt.includes(getChar(id).name.toLowerCase().split(' ')[0]));
  if(named.length)return named[0];
  const when=id=>{for(let i=msgs.length-1;i>=0;i--)if(msgs[i].cid===id)return i;return -1};
  return ids.filter(id=>id!==last.cid||ids.length===1).sort((a,b)=>when(a)-when(b))[0];
}
function grpView(m,ai){ // en grupo, los mensajes ajenos llegan a la IA con "Nombre: texto"
  if(m.role==='user')return{...m,content:(((S.profile.name||'').trim())||'User')+': '+(m.content||'')};
  if(m.cid&&m.cid===ai.cid)return m;
  return{...m,role:'user',content:((getChar(m.cid)||{}).name||'AI')+': '+(m.content||'')};
}
function systemPrompt(chat,spk){
  const g=chat.group,ch=g?getChar(spk||g[0]):(chat.charId&&getChar(chat.charId)),u=userCtx();
  if(!ch)return S.settings.sys+(u?'\n\n'+u:'');
  const M=x=>mac(x,ch);
  let s=t('rpHead',{n:ch.name,tag:ch.tagline?', '+ch.tagline:''})+(ch.sysp?M(ch.sysp)+'\n':'')+t('rpPers',{d:M(ch.desc)})+(ch.scene?t('rpScene',{s:M(ch.scene)}):'')+(ch.example?t('rpEx',{e:M(ch.example)}):'')+(u?u:'');
  if(g){const ms=g.map(getChar).filter(Boolean);s+=t('grpRule',{l:ms.map(c=>c.name).join(', '),n:ch.name,o:ms.filter(c=>c!==ch).map(c=>c.name+': '+M(c.desc).slice(0,300)).join(' | ')})}
  return s+t('rpRules')+(ch.phi?'\n'+M(ch.phi):'');
}
function grpBar(){
  const bar=$('#grpBar'),c=cur();if(!bar)return;
  if(!c||!c.group){bar.style.display='none';return}
  bar.style.display='';
  bar.innerHTML='<button type="button" class="tg" data-g="_a">'+t('grpAuto')+'</button>'+c.group.map(getChar).filter(Boolean).map(x=>`<button type="button" class="tg" data-g="${esc(x.id)}"><span class="mini">${avInner(x.img,x.emoji)}</span> ${esc(x.name)}</button>`).join('')+'<button type="button" class="tg" data-g="_all">'+t('grpAll')+'</button>';
}
$('#grpBar').onclick=async e=>{
  const b=e.target.closest('[data-g]');if(!b||busy)return;
  const chat=cur(),v=$('#input').value.trim(),g=b.dataset.g;
  if(v||pend.length){chat.messages.push({id:uid(),role:'user',content:v,...(pend.length?{files:pend}:{})});pend=[];renderChips();$('#input').value='';autosize();chat.updated=Date.now()}
  grpStop=false;
  if(g==='_all'){for(const id of chat.group.filter(getChar)){if(grpStop)break;await ask(chat,null,id);const l=chat.messages[chat.messages.length-1];if(l&&l.error)break}}
  else await ask(chat,null,g==='_a'?undefined:g);
};

/* ================= Voz (TTS gratis del navegador) ================= */
Object.assign(T.es,{voiceT:'🔊 Voz del personaje',voiceAuto:'Automática (idioma de la app)',voiceTest:'▶ Probar',voicePitch:'Tono',voiceRate:'Velocidad',listen:'🔊 Escuchar',stopV:'⏹ Detener',autoRead:'Leer respuestas',voiceNo:'Tu navegador no soporta voz',voiceTestTxt:'¡Hola! Soy {n}, listo para empezar nuestra historia.'});
Object.assign(T.en,{voiceT:'🔊 Character voice',voiceAuto:'Auto (match app language)',voiceTest:'▶ Test',voicePitch:'Pitch',voiceRate:'Speed',listen:'🔊 Listen',stopV:'⏹ Stop',autoRead:'Read replies',voiceNo:'Your browser does not support speech',voiceTestTxt:'Hello! I am {n}, ready to start our story.'});
const hasTTS='speechSynthesis' in window;
let speakId=null,speakTok=0;
const speakClean=x=>x.replace(/```[\s\S]*?```/g,' ').replace(/_\(Demo mode\)_/gi,'').replace(/\*[^*]+\*/g,' ').replace(/[*_`#>]/g,'').replace(/\s+/g,' ').trim();
function pickVoice(c){const vs=speechSynthesis.getVoices();if(c&&c.voiceURI){const v=vs.find(x=>x.voiceURI===c.voiceURI);if(v)return v}return vs.find(v=>v.lang.toLowerCase().startsWith(LANG))||null}
function speakText(txt,c,done){
  const tok=++speakTok;speechSynthesis.cancel();
  const parts=txt.match(/[^.!?…\n]+[.!?…]*\s*/g)||[txt],ch=[];let cu='';
  for(const p of parts){if(cu&&(cu+p).length>180){ch.push(cu);cu=p}else cu+=p}if(cu.trim())ch.push(cu);
  const v=pickVoice(c);
  ch.forEach((s,i)=>{const u=new SpeechSynthesisUtterance(s.trim());
    if(v){u.voice=v;u.lang=v.lang}else u.lang=LANG;
    u.pitch=(c&&c.voicePitch)||1;u.rate=(c&&c.voiceRate)||1;
    u.onend=()=>{if(tok===speakTok&&i===ch.length-1)done()};u.onerror=()=>{if(tok===speakTok)done()};
    speechSynthesis.speak(u)});
}
function syncSpeak(){$$('[data-x="speak"]').forEach(b=>b.textContent=speakId===b.dataset.mid?t('stopV'):t('listen'))}
function stopSpeak(){if(!hasTTS)return;speakTok++;speechSynthesis.cancel();speakId=null;syncSpeak()}
function speak(m,chat){
  if(!hasTTS){toast(t('voiceNo'));return}
  if(speakId===m.id){stopSpeak();return}
  const c=m.cid?getChar(m.cid):(chat.charId&&getChar(chat.charId));
  const txt=speakClean(m.content||'')||(m.content||'').trim();if(!txt)return;
  speakId=m.id;syncSpeak();
  speakText(txt,c,()=>{speakId=null;syncSpeak()});
}
function fillVoices(sel){const s=$('#cVoice');if(!s||!hasTTS)return;
  s.innerHTML='<option value="">'+esc(t('voiceAuto'))+'</option>'+speechSynthesis.getVoices().map(v=>`<option value="${esc(v.voiceURI)}">${esc(v.name)} (${esc(v.lang)})</option>`).join('');s.value=sel||''}
function voiceUI(c){
  fillVoices(c&&c.voiceURI);
  $('#cPitch').value=(c&&c.voicePitch)||1;$('#cRate').value=(c&&c.voiceRate)||1;
  $('#cPitchV').textContent=$('#cPitch').value;$('#cRateV').textContent=$('#cRate').value;
}
if(hasTTS)speechSynthesis.onvoiceschanged=()=>fillVoices($('#cVoice').value);
$('#cPitch').oninput=e=>$('#cPitchV').textContent=e.target.value;
$('#cRate').oninput=e=>$('#cRateV').textContent=e.target.value;
$('#cVoiceTest').onclick=()=>{
  if(!hasTTS){toast(t('voiceNo'));return}
  speakText(t('voiceTestTxt',{n:$('#cName').value.trim()||'Luna'}),{voiceURI:$('#cVoice').value,voicePitch:+$('#cPitch').value,voiceRate:+$('#cRate').value},()=>{});
};
$('#tgVoice').classList.toggle('on',!!S.settings.autoRead);
$('#tgVoice').onclick=e=>{S.settings.autoRead=!S.settings.autoRead;e.currentTarget.classList.toggle('on',S.settings.autoRead);if(!S.settings.autoRead)stopSpeak();save()};

applyLook();
applyStatic();
renderAll();
})();
